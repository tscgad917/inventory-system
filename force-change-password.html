<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首次登入｜變更密碼</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7f2;color:#3f4b3b;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:480px;background:#fff;border:1px solid #dfe7dc;border-radius:16px;padding:30px;box-shadow:0 6px 24px #1f372012}h1{font-size:23px;color:#365333;margin:0 0 10px}.muted{color:#6c7a67;font-size:14px;line-height:1.8}label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}input{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfd9d2;border-radius:8px}button{margin-top:18px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:9px;background:#44633f;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{font-size:14px;white-space:pre-wrap;margin-top:14px}.error{color:#b91c1c}.success{color:#166534}
</style>
</head>
<body>
<main class="card">
<h1>首次登入：請先更改密碼</h1>
<p class="muted">為保護管理帳號安全，請勿繼續使用共用初始密碼。新密碼至少 12 個字元，請勿與他人共用。</p>
<p class="muted" id="account">正在確認登入帳號……</p>
<form id="changeForm" style="display:none">
<label for="password">新密碼（至少 12 個字元）</label>
<input id="password" type="password" minlength="12" autocomplete="new-password" required>
<label for="confirmPassword">再次輸入新密碼</label>
<input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
<button id="saveBtn" type="submit">儲存新密碼並進入管理中心</button>
</form>
<div id="message" class="message"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
function message(t,kind){$("message").textContent=t;$("message").className="message "+(kind||"");}
async function init(){
 const s=await db.auth.getSession();
 if(s.error)throw s.error;
 if(!s.data.session){location.replace("https://tscgad917.github.io/login/");return;}
 const r=await db.auth.getUser();if(r.error)throw r.error;
 const user=r.data.user;
 if(!user){location.replace("https://tscgad917.github.io/login/");return;}
 $("account").textContent="登入帳號："+(user.email||"");
 if(!(user.user_metadata&&user.user_metadata.must_change_password===true)){
  location.replace("https://tscgad917.github.io/inventory-system/admin-center.html");return;
 }
 $("changeForm").style.display="block";
}
$("changeForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=$("password").value,confirmPassword=$("confirmPassword").value;
 if(password.length<12){message("新密碼至少需要 12 個字元。","error");return;}
 if(password==="00000000"){message("請勿繼續使用初始密碼。","error");return;}
 if(password!==confirmPassword){message("兩次輸入的密碼不一致。","error");return;}
 $("saveBtn").disabled=true;message("正在更新密碼……");
 try{
  const result=await db.auth.updateUser({password,data:{must_change_password:false}});
  if(result.error)throw result.error;
  message("密碼已更新，正在進入統一管理中心……","success");
  location.replace("https://tscgad917.github.io/inventory-system/admin-center.html");
 }catch(error){message("密碼更新失敗："+(error&&error.message?error.message:String(error)),"error");}
 finally{$("saveBtn").disabled=false;}
});
init().catch(e=>{console.error(e);message("無法確認登入狀態："+(e.message||String(e)),"error");});
})();
</script>
</body>
</html>
