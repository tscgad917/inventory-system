<!DOCTYPE html>

<html lang="zh-Hant">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>庫存統計</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background: #f3f6f3;

      color: #333;
    }


    /* =====================================================
       Header
       ===================================================== */

    .top-header {

      background: #14532d;

      color: white;

      padding: 18px 24px;

      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.08);
    }


    .top-header-inner {

      max-width: 1200px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .brand {

      display: flex;

      flex-direction: column;

      gap: 3px;
    }


    .brand-name {

      font-size: 15px;

      opacity: 0.92;

      letter-spacing: 0.5px;
    }


    .brand-title {

      font-size: 20px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    .header-label {

      font-size: 13px;

      opacity: 0.85;

      white-space: nowrap;
    }


    /* =====================================================
       Main
       ===================================================== */

    .container {

      max-width: 1200px;

      margin: 0 auto;

      padding: 32px 24px 48px;
    }


    .page-heading {

      margin-bottom: 24px;
    }


    .page-heading h1 {

      margin: 0 0 6px;

      color: #14532d;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 0.5px;
    }


    .page-heading p {

      margin: 0;

      color: #666;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       Back link
       ===================================================== */

    .back-link {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      margin-bottom: 18px;

      color: #14532d;

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;
    }


    .back-link:hover {

      text-decoration: underline;
    }


    /* =====================================================
       Card
       ===================================================== */

    .card {

      background: white;

      border: 1px solid #e2e8e3;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(20, 83, 45, 0.05);

      padding: 22px;

      margin-bottom: 20px;
    }


    .card-title {

      margin: 0 0 16px;

      color: #14532d;

      font-size: 18px;

      font-weight: 700;
    }


    .card-description {

      margin: -8px 0 18px;

      color: #777;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =====================================================
       Filter
       ===================================================== */

    .filter-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(240px, 1fr));

      gap: 18px;
    }


    .filter-item {

      display: flex;

      flex-direction: column;

      gap: 7px;
    }


    .filter-item label {

      color: #444;

      font-size: 14px;

      font-weight: 600;
    }


    select {

      width: 100%;

      min-height: 42px;

      padding: 9px 12px;

      border: 1px solid #cfd8d1;

      border-radius: 7px;

      background: white;

      color: #333;

      font-family: inherit;

      font-size: 14px;

      outline: none;

      cursor: pointer;
    }


    select:focus {

      border-color: #39835a;

      box-shadow:
        0 0 0 3px rgba(57, 131, 90, 0.10);
    }


    /* =====================================================
       Message
       ===================================================== */

    .message {

      margin-bottom: 20px;

      padding: 13px 16px;

      background: #edf6ef;

      border: 1px solid #d4e8d8;

      border-radius: 8px;

      color: #315b3c;

      font-size: 14px;

      line-height: 1.6;
    }


    /* =====================================================
       Progress
       ===================================================== */

    .progress-card {

      background: #edf6ef;

      border: 1px solid #d4e8d8;

      border-radius: 10px;

      padding: 18px 20px;

      margin-bottom: 20px;
    }


    .count-progress {

      color: #14532d;

      font-size: 16px;

      font-weight: 700;

      line-height: 1.6;
    }


    .pending-units {

      margin-top: 6px;

      color: #666;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =====================================================
       Fax notification
       ===================================================== */

    .fax-notification {

      margin-top: 16px;

      padding-top: 16px;

      border-top: 1px solid #d4e8d8;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      flex-wrap: wrap;
    }


    .fax-notification-info {

      color: #4f5f53;

      font-size: 13px;

      line-height: 1.7;

      flex: 1;

      min-width: 240px;
    }


    .fax-notification-info strong {

      color: #315b3c;
    }


    .fax-button {

      min-height: 40px;

      padding: 9px 16px;

      border: 1px solid #14532d;

      border-radius: 7px;

      background: #14532d;

      color: white;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }


    .fax-button:hover {

      background: #0f4224;

      border-color: #0f4224;
    }


    .fax-button:disabled {

      background: #eef1ef;

      border-color: #d5dcd7;

      color: #8a938d;

      cursor: not-allowed;
    }


    .fax-button:disabled:hover {

      background: #eef1ef;

      border-color: #d5dcd7;
    }


    /* =====================================================
       Unit list
       ===================================================== */

    .unit-card {

      background: white;

      border: 1px solid #dfe6e1;

      border-radius: 10px;

      overflow: hidden;

      margin-bottom: 12px;

      box-shadow:
        0 1px 5px rgba(20, 83, 45, 0.04);
    }


    .unit-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      padding: 15px 18px;

      background: #f8faf8;

      cursor: pointer;

      user-select: none;

      transition:
        background 0.15s ease;
    }


    .unit-header:hover {

      background: #f1f6f2;
    }


    .unit-info {

      min-width: 0;

      display: flex;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    .unit-title {

      color: #14532d;

      font-size: 16px;

      font-weight: 700;
    }


    .unit-status {

      padding: 4px 9px;

      border-radius: 20px;

      background: #e8f1ea;

      color: #477052;

      font-size: 12px;

      font-weight: 600;

      white-space: nowrap;
    }


    .unit-arrow {

      flex-shrink: 0;

      width: 28px;

      height: 28px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #e8f1ea;

      color: #14532d;

      font-size: 12px;

      font-weight: bold;
    }


    .unit-content {

      display: none;

      padding: 0 16px 16px;

      overflow-x: auto;

      background: white;
    }


    .unit-content.open {

      display: block;
    }


    /* =====================================================
       Table
       ===================================================== */

    table {

      width: 100%;

      min-width: 850px;

      margin-top: 14px;

      border-collapse: collapse;

      font-size: 14px;
    }


    th,
    td {

      border: 1px solid #dfe5e1;

      padding: 11px 10px;

      text-align: center;

      line-height: 1.5;
    }


    th {

      background: #edf4ef;

      color: #315b3c;

      font-weight: 700;

      white-space: nowrap;
    }


    td {

      background: white;

      color: #444;
    }


    tbody tr:hover td {

      background: #fafcfb;
    }


    td:first-child {

      text-align: left;

      font-weight: 600;

      color: #333;
    }


    .number {

      text-align: right;

      font-variant-numeric: tabular-nums;
    }


    /* =====================================================
       No data
       ===================================================== */

    .no-data {

      padding: 36px 20px;

      background: white;

      border: 1px solid #e1e7e2;

      border-radius: 10px;

      text-align: center;

      color: #777;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       Responsive
       ===================================================== */

    @media (max-width: 700px) {

      .top-header {

        padding: 16px 18px;
      }


      .top-header-inner {

        align-items: flex-start;
      }


      .header-label {

        display: none;
      }


      .container {

        padding: 24px 14px 40px;
      }


      .page-heading h1 {

        font-size: 24px;
      }


      .filter-grid {

        grid-template-columns: 1fr;
      }


      .card {

        padding: 18px;
      }


      .unit-header {

        padding: 14px;
      }


      .unit-info {

        gap: 8px;
      }


      .unit-title {

        font-size: 15px;
      }


      .unit-status {

        font-size: 11px;
      }


      .unit-content {

        padding:
          0 10px 12px;
      }


      .fax-notification {

        align-items: stretch;

        flex-direction: column;
      }


      .fax-button {

        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="top-header">

    <div class="top-header-inner">

      <div class="brand">

        <div class="brand-name">
          淡水信用合作社
        </div>

        <div class="brand-title">
          庫存盤點系統
        </div>

      </div>


      <div class="header-label">
        總務課管理作業
      </div>

    </div>

  </header>


  <!-- =====================================================
       Main
       ===================================================== -->

  <main class="container">


    <a
      href="admin-home.html"
      class="back-link"
    >
      ← 返回管理首頁
    </a>


    <div class="page-heading">

      <h1>
        庫存統計
      </h1>

      <p>
        查看各月份各單位耗材盤點、配送、進貨及庫存統計結果。
      </p>

    </div>


    <!-- ===================================================
         篩選條件
         =================================================== -->

    <section class="card">

      <h2 class="card-title">
        查詢條件
      </h2>

      <p class="card-description">
        請選擇盤點月份及查看單位。
      </p>


      <div class="filter-grid">


        <div class="filter-item">

          <label for="monthSelect">
            盤點月份
          </label>

          <select id="monthSelect"></select>

        </div>


        <div class="filter-item">

          <label for="unitSelect">
            查看單位
          </label>

          <select id="unitSelect">

            <option value="all">
              全部單位
            </option>

          </select>

        </div>


      </div>

    </section>


    <!-- ===================================================
         系統訊息
         =================================================== -->

    <div
      id="message"
      class="message"
    >
      資料載入中……
    </div>


    <!-- ===================================================
         盤點進度
         =================================================== -->

    <section class="progress-card">

      <div
        id="countProgress"
        class="count-progress"
      >
        本月盤點進度：讀取中……
      </div>


      <div
        id="pendingUnits"
        class="pending-units"
      ></div>


      <!-- =================================================
           未盤點傳真通知
           ================================================= -->

      <div class="fax-notification">

        <div
          id="faxNotificationInfo"
          class="fax-notification-info"
        >
          盤點當日 16:45 後，可產生未盤點傳真通知。
        </div>


        <button
          id="faxNotificationButton"
          class="fax-button"
          type="button"
          disabled
        >
          產生未盤點傳真通知 PDF
        </button>

      </div>

    </section>


    <!-- ===================================================
         單位資料
         =================================================== -->

    <div id="unitContainer"></div>


  </main>


  <script>


    // =====================================================
    // 登入檢查
    // =====================================================

    const accessToken =
      localStorage.getItem(
        "admin_access_token"
      );


    if (!accessToken) {

      window.location.href =
        "admin.html";

    }


    const SUPABASE_URL =
      "https://onebxqajsiqmhfcizaxl.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


    let inventoryData = [];


    // =====================================================
    // 盤點期間資料
    // =====================================================

    let inventoryPeriods = [];


    // =====================================================
    // 取得台灣當地日期
    //
    // 使用瀏覽器當地時間，避免 UTC 日期造成日期偏移。
    // =====================================================

    function getLocalDateString() {

      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    // =====================================================
    // 判斷目前是否已經到 16:45
    // =====================================================

    function isAfter1645() {

      const now =
        new Date();


      const hour =
        now.getHours();


      const minute =
        now.getMinutes();


      return (
        hour > 16 ||
        (
          hour === 16 &&
          minute >= 45
        )
      );

    }


    // =====================================================
    // 取得指定月份的盤點期間
    // =====================================================

    function getSelectedPeriod(
      selectedMonth
    ) {

      return inventoryPeriods.find(
        period => {

          if (
            !period.period_month
          ) {

            return false;

          }


          return String(
            period.period_month
          ).substring(
            0,
            7
          ) === selectedMonth;

        }
      );

    }


    // =====================================================
    // 載入資料
    // =====================================================

    async function loadInventory() {

      try {


        // =================================================
        // 讀取盤點期間
        // =================================================

        const periodResponse =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_periods?select=period_month,count_date,is_open,note&order=period_month.desc",
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  accessToken
              }
            }
          );


        if (!periodResponse.ok) {

          const errorText =
            await periodResponse.text();

          console.error(
            errorText
          );


          document.getElementById(
            "message"
          ).textContent =
            "盤點期間資料讀取失敗。";


          return;

        }


        inventoryPeriods =
          await periodResponse.json();


        // =================================================
        // 讀取庫存統計資料
        // =================================================

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_expected?select=*",
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  accessToken
              }
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            errorText
          );


          document.getElementById(
            "message"
          ).textContent =
            "庫存資料讀取失敗。";


          return;

        }


        inventoryData =
          await response.json();


        // =================================================
        // 建立月份選單
        //
        // 月份來源：
        // 1. inventory_periods 已設定的月份
        // 2. inventory_expected 已存在的歷史盤點月份
        // =================================================

        const periodMonths =
          inventoryPeriods
            .map(period => {

              if (
                !period.period_month
              ) {

                return null;

              }


              return String(
                period.period_month
              ).substring(
                0,
                7
              );

            })
            .filter(
              month => month
            );


        const inventoryMonths =
          inventoryData
            .map(row => {

              if (
                !row.count_date
              ) {

                return null;

              }


              return String(
                row.count_date
              ).substring(
                0,
                7
              );

            })
            .filter(
              month => month
            );


        const months = [
          ...new Set([
            ...periodMonths,
            ...inventoryMonths
          ])
        ].sort().reverse();


        const monthSelect =
          document.getElementById(
            "monthSelect"
          );


        monthSelect.innerHTML =
          "";


        months.forEach(
          month => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              month;


            const [
              year,
              monthNumber
            ] =
              month.split("-");


            option.textContent =
              year +
              "年" +
              Number(
                monthNumber
              ) +
              "月";


            monthSelect.appendChild(
              option
            );

          }
        );


        // =================================================
        // 建立單位選單
        //
        // 單位仍以既有庫存資料為來源
        // =================================================

        const units = [];


        inventoryData.forEach(
          row => {

            if (
              row.unit_name &&
              !units.includes(
                row.unit_name
              )
            ) {

              units.push(
                row.unit_name
              );

            }

          }
        );


        const unitSelect =
          document.getElementById(
            "unitSelect"
          );


        unitSelect.innerHTML =
          '<option value="all">全部單位</option>';


        units.forEach(
          unit => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              unit;

            option.textContent =
              unit;


            unitSelect.appendChild(
              option
            );

          }
        );


        // =================================================
        // 沒有任何盤點期間
        // =================================================

        if (
          months.length === 0
        ) {

          document.getElementById(
            "message"
          ).textContent =
            "目前尚未建立任何盤點期間。";


          document.getElementById(
            "countProgress"
          ).textContent =
            "本月盤點進度：尚無資料";


          document.getElementById(
            "pendingUnits"
          ).textContent =
            "";


          document.getElementById(
            "unitContainer"
          ).innerHTML =
            '<div class="no-data">目前尚未建立盤點期間。</div>';


          updateFaxNotificationButton();

          return;

        }


        // =================================================
        // 第一次載入
        // =================================================

        updatePage();


        document.getElementById(
          "message"
        ).style.display =
          "none";


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "message"
        ).textContent =
          "系統連線失敗，請稍後再試。";

      }

    }


    // =====================================================
    // 更新整個頁面
    // =====================================================

    function updatePage() {


      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      const selectedUnit =
        document.getElementById(
          "unitSelect"
        ).value;


      updateProgress(
        selectedMonth
      );


      renderUnits(
        selectedMonth,
        selectedUnit
      );


      updateFaxNotificationButton();

    }


    // =====================================================
    // 取得指定月份的所有單位
    //
    // 固定以目前系統既有單位為準。
    // =====================================================

    function getAllUnits() {

      return [
        ...new Set(
          inventoryData
            .map(
              row =>
                row.unit_name
            )
            .filter(
              unit =>
                unit
            )
        )
      ];

    }


    // =====================================================
    // 取得指定月份的盤點資料
    // =====================================================

    function getMonthData(
      selectedMonth
    ) {

      return inventoryData.filter(
        row =>
          row.count_date &&
          row.count_date.substring(
            0,
            7
          ) === selectedMonth
      );

    }


    // =====================================================
    // 判斷單位是否完成盤點
    //
    // 6 項全部有 counted_quantity
    // 才算完成。
    // =====================================================

    function isUnitCompleted(
      monthData,
      unit
    ) {

      const unitRows =
        monthData.filter(
          row =>
            row.unit_name ===
            unit
        );


      return (
        unitRows.length === 6 &&
        unitRows.every(
          row =>
            row.counted_quantity !==
            null
        )
      );

    }


    // =====================================================
    // 取得指定月份未盤點單位
    // =====================================================

    function getPendingUnits(
      selectedMonth
    ) {

      const monthData =
        getMonthData(
          selectedMonth
        );


      const allUnits =
        getAllUnits();


      return allUnits.filter(
        unit =>
          !isUnitCompleted(
            monthData,
            unit
          )
      );

    }


    // =====================================================
    // 更新盤點進度
    // =====================================================

    function updateProgress(
      selectedMonth
    ) {


      const monthData =
        getMonthData(
          selectedMonth
        );


      const allUnits =
        getAllUnits();


      const completedUnits =
        allUnits.filter(
          unit =>
            isUnitCompleted(
              monthData,
              unit
            )
        );


      const pendingUnits =
        allUnits.filter(
          unit =>
            !completedUnits.includes(
              unit
            )
        );


      // =================================================
      // 尚未有任何資料的月份
      // =================================================

      if (
        monthData.length === 0
      ) {


        document.getElementById(
          "countProgress"
        ).textContent =
          `本月盤點進度：0 / ${allUnits.length} 個單位已完成`;


        document.getElementById(
          "pendingUnits"
        ).textContent =
          allUnits.length > 0
            ? "尚未盤點：" +
              allUnits.join("、")
            : "目前尚無單位資料";


        return;

      }


      // =================================================
      // 已有部分或全部盤點資料
      // =================================================

      document.getElementById(
        "countProgress"
      ).textContent =
        `本月盤點進度：${completedUnits.length} / ${allUnits.length} 個單位已完成`;


      document.getElementById(
        "pendingUnits"
      ).textContent =
        pendingUnits.length > 0
          ? "尚未盤點：" +
            pendingUnits.join("、")
          : "所有單位均已完成盤點";

    }


    // =====================================================
    // 更新未盤點傳真通知按鈕
    //
    // 本階段只做「判定」，
    // 尚未真正產生 PDF。
    // =====================================================

    function updateFaxNotificationButton() {

      const button =
        document.getElementById(
          "faxNotificationButton"
        );


      const info =
        document.getElementById(
          "faxNotificationInfo"
        );


      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      const period =
        getSelectedPeriod(
          selectedMonth
        );


      // =================================================
      // 沒有盤點期間
      // =================================================

      if (!period) {

        button.disabled =
          true;

        info.textContent =
          "目前沒有對應的盤點期間。";

        return;

      }


      const today =
        getLocalDateString();


      // =================================================
      // 不是當日盤點日
      // =================================================

      if (
        period.count_date !==
        today
      ) {

        button.disabled =
          true;

        info.textContent =
          `本月份盤點日為 ${period.count_date}，僅限盤點當日 16:45 後產生未盤點通知。`;

        return;

      }


      // =================================================
      // 尚未到 16:45
      // =================================================

      if (
        !isAfter1645()
      ) {

        button.disabled =
          true;

        info.textContent =
          "盤點當日 16:45 後，才可產生未盤點傳真通知。";

        return;

      }


      // =================================================
      // 16:45 後
      // =================================================

      const pendingUnits =
        getPendingUnits(
          selectedMonth
        );


      if (
        pendingUnits.length === 0
      ) {

        button.disabled =
          true;

        info.innerHTML =
          "<strong>截至目前，所有單位均已完成盤點。</strong>";

        return;

      }


      button.disabled =
        false;


      info.innerHTML =
        `<strong>截至 16:45 後尚未完成盤點：</strong>${pendingUnits.join("、")}`;

    }


    // =====================================================
    // 點擊未盤點傳真通知
    //
    // 本階段先確認判定結果。
    // 下一階段再接 PDF + QR Code。
    // =====================================================

    document.getElementById(
      "faxNotificationButton"
    ).onclick =
      function() {

        const selectedMonth =
          document.getElementById(
            "monthSelect"
          ).value;


        const period =
          getSelectedPeriod(
            selectedMonth
          );


        if (!period) {

          alert(
            "目前沒有對應的盤點期間。"
          );

          return;

        }


        const today =
          getLocalDateString();


        if (
          period.count_date !==
          today
        ) {

          alert(
            "未盤點傳真通知僅限盤點當日產生。"
          );

          return;

        }


        if (
          !isAfter1645()
        ) {

          alert(
            "未盤點傳真通知須於盤點當日 16:45 後產生。"
          );

          return;

        }


        const pendingUnits =
          getPendingUnits(
            selectedMonth
          );


        if (
          pendingUnits.length === 0
        ) {

          alert(
            "截至目前，所有單位均已完成盤點，無需產生未盤點通知。"
          );

          updateFaxNotificationButton();

          return;

        }


        alert(
          "目前未盤點單位：\n\n" +
          pendingUnits.join(
            "、"
          ) +
          "\n\n未盤點單位判定正常。\n\n下一階段將在此處產生統一格式的傳真通知 PDF。"
        );

      };


    // =====================================================
    // 顯示單位
    // =====================================================

    function renderUnits(
      selectedMonth,
      selectedUnit
    ) {


      const container =
        document.getElementById(
          "unitContainer"
        );


      container.innerHTML =
        "";


      const monthData =
        getMonthData(
          selectedMonth
        );


      // =================================================
      // 尚未有任何盤點資料
      // =================================================

      if (
        monthData.length === 0
      ) {

        container.innerHTML =
          '<div class="no-data">本月份尚無盤點資料。</div>';


        return;

      }


      // =================================================
      // 單位仍以該月份實際資料為準
      // =================================================

      let units =
        [
          ...new Set(
            monthData.map(
              row =>
                row.unit_name
            )
          )
        ];


      if (
        selectedUnit !==
        "all"
      ) {

        units =
          units.filter(
            unit =>
              unit ===
              selectedUnit
          );

      }


      if (
        units.length === 0
      ) {

        container.innerHTML =
          '<div class="no-data">目前沒有符合條件的資料。</div>';


        return;

      }


      units.forEach(
        unit => {


          const unitRows =
            monthData.filter(
              row =>
                row.unit_name ===
                unit
            );


          const completedCount =
            unitRows.filter(
              row =>
                row.counted_quantity !==
                null
            ).length;


          const totalCount =
            6;


          const completed =
            completedCount ===
            totalCount;


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "unit-card";


          // ===============================================
          // 單位標題
          // ===============================================

          const header =
            document.createElement(
              "div"
            );


          header.className =
            "unit-header";


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "unit-info";


          const unitTitle =
            document.createElement(
              "span"
            );


          unitTitle.className =
            "unit-title";


          unitTitle.textContent =
            unit;


          const unitStatus =
            document.createElement(
              "span"
            );


          unitStatus.className =
            "unit-status";


          unitStatus.textContent =
            completed
              ? `${completedCount} / ${totalCount} 已完成`
              : `${completedCount} / ${totalCount} 尚未完成`;


          title.appendChild(
            unitTitle
          );


          title.appendChild(
            unitStatus
          );


          const arrow =
            document.createElement(
              "span"
            );


          arrow.className =
            "unit-arrow";


          arrow.textContent =
            "▶";


          header.appendChild(
            title
          );


          header.appendChild(
            arrow
          );


          // ===============================================
          // 表格內容
          // ===============================================

          const content =
            document.createElement(
              "div"
            );


          content.className =
            "unit-content";


          const table =
            document.createElement(
              "table"
            );


          table.innerHTML = `

            <thead>

              <tr>

                <th>耗材</th>

                <th>月初盤點</th>

                <th>配送異動</th>

                <th>廠商進貨</th>

                <th>應有庫存</th>

                <th>下月盤點</th>

                <th>差異</th>

              </tr>

            </thead>

            <tbody></tbody>

          `;


          const tbody =
            table.querySelector(
              "tbody"
            );


          unitRows.forEach(
            row => {


              const tr =
                document.createElement(
                  "tr"
                );


              const countedText =
                row.counted_quantity ===
                null
                  ? "尚未盤點"
                  : row.counted_quantity;


              const expectedText =
                row.expected_quantity ===
                null
                  ? "—"
                  : row.expected_quantity;


              const nextCountedText =
                row.next_counted_quantity ===
                null
                  ? "尚未盤點"
                  : row.next_counted_quantity;


              const differenceText =
                row.inventory_difference ===
                null
                  ? "—"
                  : row.inventory_difference;


              tr.innerHTML = `

                <td>
                  ${row.item_name}
                </td>

                <td class="number">
                  ${countedText}
                </td>

                <td class="number">
                  ${row.delivery_adjustment}
                </td>

                <td class="number">
                  ${row.purchase_quantity}
                </td>

                <td class="number">
                  ${expectedText}
                </td>

                <td class="number">
                  ${nextCountedText}
                </td>

                <td class="number">
                  ${differenceText}
                </td>

              `;


              tbody.appendChild(
                tr
              );

            }
          );


          content.appendChild(
            table
          );


          // ===============================================
          // 點擊展開／收合
          // ===============================================

          header.onclick =
            function() {


              const isOpen =
                content.classList.contains(
                  "open"
                );


              if (
                isOpen
              ) {

                content.classList.remove(
                  "open"
                );


                arrow.textContent =
                  "▶";


              } else {

                content.classList.add(
                  "open"
                );


                arrow.textContent =
                  "▼";

              }

            };


          card.appendChild(
            header
          );


          card.appendChild(
            content
          );


          container.appendChild(
            card
          );

        }
      );

    }


    // =====================================================
    // 月份切換
    // =====================================================

    document.getElementById(
      "monthSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 單位切換
    // =====================================================

    document.getElementById(
      "unitSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 開始載入
    // =====================================================

    loadInventory();

  </script>

</body>

</html>
