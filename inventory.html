<!DOCTYPE html>

<html lang="zh-Hant">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>庫存統計</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      background: #f3f6f3;

      color: #333;
    }


    /* =====================================================
       Header
       ===================================================== */

    .top-header {

      background: #14532d;

      color: white;

      padding: 18px 24px;

      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.08);
    }


    .top-header-inner {

      max-width: 1200px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .brand {

      display: flex;

      flex-direction: column;

      gap: 3px;
    }


    .brand-name {

      font-size: 15px;

      opacity: 0.92;

      letter-spacing: 0.5px;
    }


    .brand-title {

      font-size: 20px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    .header-label {

      font-size: 13px;

      opacity: 0.85;

      white-space: nowrap;
    }


    /* =====================================================
       Main
       ===================================================== */

    .container {

      max-width: 1200px;

      margin: 0 auto;

      padding: 32px 24px 48px;
    }


    .page-heading {

      margin-bottom: 24px;
    }


    .page-heading h1 {

      margin: 0 0 6px;

      color: #14532d;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 0.5px;
    }


    .page-heading p {

      margin: 0;

      color: #666;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       Back link
       ===================================================== */

    .back-link {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      margin-bottom: 18px;

      color: #14532d;

      text-decoration: none;

      font-size: 14px;

      font-weight: 600;
    }


    .back-link:hover {

      text-decoration: underline;
    }


    /* =====================================================
       Card
       ===================================================== */

    .card {

      background: white;

      border: 1px solid #e2e8e3;

      border-radius: 12px;

      box-shadow:
        0 2px 8px rgba(20, 83, 45, 0.05);

      padding: 22px;

      margin-bottom: 20px;
    }


    .card-title {

      margin: 0 0 16px;

      color: #14532d;

      font-size: 18px;

      font-weight: 700;
    }


    .card-description {

      margin: -8px 0 18px;

      color: #777;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =====================================================
       Filter
       ===================================================== */

    .filter-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(240px, 1fr));

      gap: 18px;
    }


    .filter-item {

      display: flex;

      flex-direction: column;

      gap: 7px;
    }


    .filter-item label {

      color: #444;

      font-size: 14px;

      font-weight: 600;
    }


    select {

      width: 100%;

      min-height: 42px;

      padding: 9px 12px;

      border: 1px solid #cfd8d1;

      border-radius: 7px;

      background: white;

      color: #333;

      font-family: inherit;

      font-size: 14px;

      outline: none;

      cursor: pointer;
    }


    select:focus {

      border-color: #39835a;

      box-shadow:
        0 0 0 3px rgba(57, 131, 90, 0.10);
    }


    /* =====================================================
       Message
       ===================================================== */

    .message {

      margin-bottom: 20px;

      padding: 13px 16px;

      background: #edf6ef;

      border: 1px solid #d4e8d8;

      border-radius: 8px;

      color: #315b3c;

      font-size: 14px;

      line-height: 1.6;
    }


    /* =====================================================
       Progress
       ===================================================== */

    .progress-card {

      background: #edf6ef;

      border: 1px solid #d4e8d8;

      border-radius: 10px;

      padding: 18px 20px;

      margin-bottom: 18px;
    }


    .count-progress {

      color: #14532d;

      font-size: 16px;

      font-weight: 700;

      line-height: 1.6;
    }


    .pending-units {

      margin-top: 6px;

      color: #666;

      font-size: 13px;

      line-height: 1.7;
    }


    /* =====================================================
       未盤點傳真通知
       ===================================================== */

    .fax-notification {

      margin-top: 16px;

      padding-top: 16px;

      border-top: 1px solid #d4e8d8;
    }


    .fax-notification-title {

      margin-bottom: 6px;

      color: #14532d;

      font-size: 14px;

      font-weight: 700;
    }


    .fax-notification-info {

      margin-bottom: 12px;

      color: #666;

      font-size: 13px;

      line-height: 1.7;
    }


    .fax-unit-list {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(180px, 1fr));

      gap: 8px 14px;

      margin-bottom: 14px;

      padding: 13px 14px;

      background: white;

      border: 1px solid #d7e5da;

      border-radius: 8px;
    }


    .fax-unit-item {

      display: flex;

      align-items: center;

      gap: 8px;

      min-height: 34px;

      padding: 5px 6px;

      border-radius: 6px;

      color: #444;

      font-size: 14px;

      cursor: pointer;
    }


    .fax-unit-item:hover {

      background: #f3f7f4;
    }


    .fax-unit-item input {

      width: 17px;

      height: 17px;

      margin: 0;

      accent-color: #14532d;

      cursor: pointer;

      flex-shrink: 0;
    }


    .fax-empty {

      padding: 12px;

      color: #666;

      font-size: 13px;

      text-align: center;
    }


    .fax-button {

      min-height: 42px;

      padding: 9px 18px;

      border: 1px solid #14532d;

      border-radius: 7px;

      background: #14532d;

      color: white;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease;
    }


    .fax-button:hover:not(:disabled) {

      background: #0f4224;

      border-color: #0f4224;
    }


    .fax-button:disabled {

      background: #c8d1cb;

      border-color: #c8d1cb;

      color: #f5f5f5;

      cursor: not-allowed;

      opacity: 1;
    }


    /* =====================================================
       PDF 隱藏產生區
       ===================================================== */

    #pdfPagesContainer {

      position: fixed;

      left: -10000px;

      top: 0;

      width: 794px;

      background: white;

      z-index: -1;
    }


    .pdf-page {

      width: 794px;

      min-height: 1123px;

      padding: 70px 65px;

      background: white;

      color: #222;

      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    .pdf-header {

      width: 100%;

      text-align: center;

      margin-bottom: 45px;
    }


    .pdf-brand {

      font-size: 22px;

      font-weight: 700;

      color: #14532d;

      letter-spacing: 2px;

      margin-bottom: 18px;
    }


    .pdf-title {

      font-size: 28px;

      font-weight: 700;

      color: #14532d;

      letter-spacing: 2px;
    }


    .pdf-date-box {

      width: 100%;

      margin-bottom: 38px;

      padding: 18px 22px;

      border: 1px solid #d7e1da;

      background: #f3f7f4;

      border-radius: 8px;

      text-align: center;

      font-size: 17px;

      line-height: 1.8;
    }


    .pdf-body {

      width: 100%;

      font-size: 18px;

      line-height: 2.15;

      text-align: left;

      margin-bottom: 28px;
    }


    .pdf-body p {

      margin: 0 0 16px;
    }


    .pdf-qr-title {

      margin-top: 10px;

      margin-bottom: 14px;

      font-size: 17px;

      font-weight: 700;

      color: #14532d;

      text-align: center;
    }


    .pdf-qr {

      width: 300px;

      height: 300px;

      margin: 0 auto 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: white;
    }


    .pdf-qr img {

      width: 300px;

      height: 300px;

      display: block;
    }


    .pdf-url-note {

      font-size: 14px;

      color: #777;

      text-align: center;

      margin-bottom: 55px;
    }


    .pdf-footer {

      width: 100%;

      margin-top: auto;

      padding-top: 22px;

      border-top: 1px solid #d9e1db;

      text-align: right;

      font-size: 16px;

      line-height: 1.8;

      color: #333;
    }


    /* =====================================================
       Unit list
       ===================================================== */

    .unit-card {

      background: white;

      border: 1px solid #dfe6e1;

      border-radius: 10px;

      overflow: hidden;

      margin-bottom: 12px;

      box-shadow:
        0 1px 5px rgba(20, 83, 45, 0.04);
    }


    .unit-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      padding: 15px 18px;

      background: #f8faf8;

      cursor: pointer;

      user-select: none;

      transition:
        background 0.15s ease;
    }


    .unit-header:hover {

      background: #f1f6f2;
    }


    .unit-info {

      min-width: 0;

      display: flex;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    .unit-title {

      color: #14532d;

      font-size: 16px;

      font-weight: 700;
    }


    .unit-status {

      padding: 4px 9px;

      border-radius: 20px;

      background: #e8f1ea;

      color: #477052;

      font-size: 12px;

      font-weight: 600;

      white-space: nowrap;
    }


    .unit-arrow {

      flex-shrink: 0;

      width: 28px;

      height: 28px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background: #e8f1ea;

      color: #14532d;

      font-size: 12px;

      font-weight: bold;
    }


    .unit-content {

      display: none;

      padding: 0 16px 16px;

      overflow-x: auto;

      background: white;
    }


    .unit-content.open {

      display: block;
    }


    /* =====================================================
       Table
       ===================================================== */

    table {

      width: 100%;

      min-width: 850px;

      margin-top: 14px;

      border-collapse: collapse;

      font-size: 14px;
    }


    th,
    td {

      border: 1px solid #dfe5e1;

      padding: 11px 10px;

      text-align: center;

      line-height: 1.5;
    }


    th {

      background: #edf4ef;

      color: #315b3c;

      font-weight: 700;

      white-space: nowrap;
    }


    td {

      background: white;

      color: #444;
    }


    tbody tr:hover td {

      background: #fafcfb;
    }


    td:first-child {

      text-align: left;

      font-weight: 600;

      color: #333;
    }


    .number {

      text-align: right;

      font-variant-numeric: tabular-nums;
    }


    /* =====================================================
       No data
       ===================================================== */

    .no-data {

      padding: 36px 20px;

      background: white;

      border: 1px solid #e1e7e2;

      border-radius: 10px;

      text-align: center;

      color: #777;

      font-size: 14px;

      line-height: 1.7;
    }


    /* =====================================================
       Responsive
       ===================================================== */

    @media (max-width: 700px) {

      .top-header {

        padding: 16px 18px;
      }


      .top-header-inner {

        align-items: flex-start;
      }


      .header-label {

        display: none;
      }


      .container {

        padding: 24px 14px 40px;
      }


      .page-heading h1 {

        font-size: 24px;
      }


      .filter-grid {

        grid-template-columns: 1fr;
      }


      .card {

        padding: 18px;
      }


      .fax-unit-list {

        grid-template-columns: 1fr;

      }


      .unit-header {

        padding: 14px;
      }


      .unit-info {

        gap: 8px;
      }


      .unit-title {

        font-size: 15px;
      }


      .unit-status {

        font-size: 11px;
      }


      .unit-content {

        padding:
          0 10px 12px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       Header
       ===================================================== -->

  <header class="top-header">

    <div class="top-header-inner">

      <div class="brand">

        <div class="brand-name">
          淡水信用合作社
        </div>

        <div class="brand-title">
          庫存盤點系統
        </div>

      </div>


      <div class="header-label">

      </div>

    </div>

  </header>


  <!-- =====================================================
       Main
       ===================================================== -->

  <main class="container">


    <a

    >
      ← 返回管理首頁

    <div class="page-heading">

      <h1>

      </h1>

    <!-- ===================================================

        <div class="filter-item">

    <!-- ===================================================

      id="message"

    <!-- ===================================================

    <section class="progress-card">

      <div
        id="countProgress"
        class="count-progress"
      >
        本月盤點進度：讀取中……
      </div>


      <div

      ></div>


      <!-- =================================================
           未盤點傳真通知
           ================================================= -->

      <div class="fax-notification">

        <div class="fax-notification-title">
          未盤點傳真通知
        </div>


        <div
          id="faxNotificationInfo"
          class="fax-notification-info"
        >
          測試模式：目前模擬 2026-10-01 16:45。
        </div>


        <!-- =================================================
             未盤點單位勾選區
             ================================================= -->

        <div
          id="faxUnitList"
          class="fax-unit-list"
          style="display: none;"
        ></div>


        <button
          id="faxNotificationButton"
          class="fax-button"
          type="button"
          disabled
        >
          產生未盤點傳真通知 PDF
        </button>

      </div>

    </section>


    <!-- ===================================================
         單位資料
         =================================================== -->

    <div id="unitContainer"></div>


  </main>


  <!-- =====================================================
       PDF 隱藏產生區
       ===================================================== -->

  <div id="pdfPagesContainer"></div>


  <!-- =====================================================
       PDF / QR Code 套件
       ===================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
  ></script>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
  ></script>


  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ></script>


  <script>


    // =====================================================
    // 登入檢查
    // =====================================================

    const accessToken =
      localStorage.getItem(
        "admin_access_token"
      );


    if (!accessToken) {

      window.location.href =
        "admin.html";

    }


    const SUPABASE_URL =
      "https://onebxqajsiqmhfcizaxl.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


    const INVENTORY_SYSTEM_URL =
      "https://tscgad917.github.io/inventory-system/";


    // =====================================================
    // ★ 測試模式
    //
    // 這一段是暫時測試用。
    //
    // TEST_MODE = true：
    // 模擬目前日期為 2026-10-01
    // 模擬目前時間為 16:45
    //
    // 正式上線前會恢復：
    // TEST_MODE = false
    // 並刪除 TEST_DATE / TEST_TIME
    // =====================================================

    const TEST_MODE = true;

    const TEST_DATE = "2026-10-01";

    const TEST_TIME = "16:45";


    let inventoryData = [];


    let inventoryPeriods = [];


    // =====================================================
    // 取得目前系統日期
    // =====================================================

    function getLocalDateString() {

      if (TEST_MODE) {

        return TEST_DATE;

      }


      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        ).padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }


    // =====================================================
    // 取得目前系統時間
    // =====================================================

    function getCurrentTimeString() {

      if (TEST_MODE) {

        return TEST_TIME;

      }


      const now =
        new Date();


      const hour =
        String(
          now.getHours()
        ).padStart(
          2,
          "0"
        );


      const minute =
        String(
          now.getMinutes()
        ).padStart(
          2,
          "0"
        );


      return (
        hour +
        ":" +
        minute
      );

    }


    // =====================================================
    // 判斷目前是否已經到 16:45
    // =====================================================

    function isAfter1645() {

      const currentTime =
        getCurrentTimeString();


      return (
        currentTime >=
        "16:45"
      );

    }


    // =====================================================
    // 取得選定月份的盤點期間
    // =====================================================

    function getSelectedPeriod(
      selectedMonth
    ) {

      return (
        inventoryPeriods.find(
          period => {

            if (
              !period.period_month
            ) {

              return false;

            }


            return String(
              period.period_month
            ).substring(
              0,
              7
            ) === selectedMonth;

          }
        ) || null
      );

    }


    // =====================================================
    // 取得系統所有單位
    // =====================================================

    function getAllUnits() {

      return [
        ...new Set(
          inventoryData
            .map(
              row =>
                row.unit_name
            )
            .filter(
              unit =>
                unit
            )
        )
      ];

    }


    // =====================================================
    // 取得指定月份資料
    // =====================================================

    function getMonthData(
      selectedMonth
    ) {

      return inventoryData.filter(
        row =>
          row.count_date &&
          row.count_date.substring(
            0,
            7
          ) === selectedMonth
      );

    }


    // =====================================================
    // 判斷單位是否完成盤點
    // =====================================================

    function isUnitCompleted(
      monthData,
      unit
    ) {

      const unitRows =
        monthData.filter(
          row =>
            row.unit_name ===
            unit
        );


      return (
        unitRows.length === 6 &&
        unitRows.every(
          row =>
            row.counted_quantity !==
            null
        )
      );

    }


    // =====================================================
    // 取得尚未完成盤點的單位
    // =====================================================

    function getPendingUnits(
      selectedMonth
    ) {

      const monthData =
        getMonthData(
          selectedMonth
        );


      const allUnits =
        getAllUnits();


      return allUnits.filter(
        unit =>
          !isUnitCompleted(
            monthData,
            unit
          )
      );

    }


    // =====================================================
    // 載入資料
    // =====================================================

    async function loadInventory() {

      try {


        // =================================================
        // 讀取盤點期間
        // =================================================

        const periodResponse =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_periods?select=period_month,count_date,is_open,note&order=period_month.desc",
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  accessToken
              }
            }
          );


        if (!periodResponse.ok) {

          const errorText =
            await periodResponse.text();

          console.error(
            errorText
          );


          document.getElementById(
            "message"
          ).textContent =
            "盤點期間資料讀取失敗。";


          return;

        }


        inventoryPeriods =
          await periodResponse.json();


        // =================================================
        // 讀取庫存統計資料
        // =================================================

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_expected?select=*",
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  accessToken
              }
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            errorText
          );


          document.getElementById(
            "message"
          ).textContent =
            "庫存資料讀取失敗。";


          return;

        }


        inventoryData =
          await response.json();


        // =================================================
        // 建立月份選單
        //
        // 月份來源：
        // 1. inventory_periods 已設定的月份
        // 2. inventory_expected 已存在的歷史盤點月份
        // =================================================

        const periodMonths =
          inventoryPeriods
            .map(period => {

              if (
                !period.period_month
              ) {

                return null;

              }


              return String(
                period.period_month
              ).substring(
                0,
                7
              );

            })
            .filter(
              month => month
            );


        const inventoryMonths =
          inventoryData
            .map(row => {

              if (
                !row.count_date
              ) {

                return null;

              }


              return String(
                row.count_date
              ).substring(
                0,
                7
              );

            })
            .filter(
              month => month
            );


        const months = [
          ...new Set([
            ...periodMonths,
            ...inventoryMonths
          ])
        ].sort().reverse();


        const monthSelect =
          document.getElementById(
            "monthSelect"
          );


        monthSelect.innerHTML =
          "";


        months.forEach(
          month => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              month;


            const [
              year,
              monthNumber
            ] =
              month.split("-");


            option.textContent =
              year +
              "年" +
              Number(
                monthNumber
              ) +
              "月";


            monthSelect.appendChild(
              option
            );

          }
        );


        // =================================================
        // ★ 測試模式自動選擇 2026 年 10 月
        // =================================================

        if (
          TEST_MODE &&
          months.includes(
            TEST_DATE.substring(
              0,
              7
            )
          )
        ) {

          monthSelect.value =
            TEST_DATE.substring(
              0,
              7
            );

        }


        // =================================================
        // 建立單位選單
        //
        // 單位仍以既有庫存資料為來源
        // =================================================

        const units = [];


        inventoryData.forEach(
          row => {

            if (
              row.unit_name &&
              !units.includes(
                row.unit_name
              )
            ) {

              units.push(
                row.unit_name
              );

            }

          }
        );


        const unitSelect =
          document.getElementById(
            "unitSelect"
          );


        unitSelect.innerHTML =
          '<option value="all">全部單位</option>';


        units.forEach(
          unit => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              unit;


            option.textContent =
              unit;


            unitSelect.appendChild(
              option
            );

          }
        );


        // =================================================
        // 沒有任何盤點期間
        // =================================================

        if (
          months.length === 0
        ) {

          document.getElementById(
            "message"
          ).textContent =
            "目前尚未建立任何盤點期間。";


          document.getElementById(
            "countProgress"
          ).textContent =
            "本月盤點進度：尚無資料";


          document.getElementById(
            "pendingUnits"
          ).textContent =
            "";


          document.getElementById(
            "unitContainer"
          ).innerHTML =
            '<div class="no-data">目前尚未建立盤點期間。</div>';


          updateFaxNotificationButton();


          return;

        }


        // =================================================
        // 第一次載入
        // =================================================

        updatePage();


        document.getElementById(
          "message"
        ).style.display =
          "none";


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "message"
        ).textContent =
          "系統連線失敗，請稍後再試。";

      }

    }


    // =====================================================
    // 更新整個頁面
    // =====================================================

    function updatePage() {


      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      const selectedUnit =
        document.getElementById(
          "unitSelect"
        ).value;


      updateProgress(
        selectedMonth
      );


      updateFaxNotificationButton();


      renderUnits(
        selectedMonth,
        selectedUnit
      );

    }


    // =====================================================
    // 更新盤點進度
    // =====================================================

    function updateProgress(
      selectedMonth
    ) {


      const monthData =
        getMonthData(
          selectedMonth
        );


      const allUnits =
        getAllUnits();


      const completedUnits =
        allUnits.filter(
          unit =>
            isUnitCompleted(
              monthData,
              unit
            )
        );


      const pendingUnits =
        allUnits.filter(
          unit =>
            !completedUnits.includes(
              unit
            )
        );


      // =================================================
      // 尚未有任何資料的月份
      // =================================================

      if (
        monthData.length === 0
      ) {


        document.getElementById(
          "countProgress"
        ).textContent =
          `本月盤點進度：0 / ${allUnits.length} 個單位已完成`;


        document.getElementById(
          "pendingUnits"
        ).textContent =
          allUnits.length > 0
            ? "尚未盤點：" +
              allUnits.join("、")
            : "目前尚無單位資料";


        return;

      }


      // =================================================
      // 已有部分或全部盤點資料
      // =================================================

      document.getElementById(
        "countProgress"
      ).textContent =
        `本月盤點進度：${completedUnits.length} / ${allUnits.length} 個單位已完成`;


      document.getElementById(
        "pendingUnits"
      ).textContent =
        pendingUnits.length > 0
          ? "尚未盤點：" +
            pendingUnits.join("、")
          : "所有單位均已完成盤點";

    }


    // =====================================================
    // 更新未盤點傳真通知區
    // =====================================================

    function updateFaxNotificationButton() {

      const button =
        document.getElementById(
          "faxNotificationButton"
        );


      const info =
        document.getElementById(
          "faxNotificationInfo"
        );


      const unitList =
        document.getElementById(
          "faxUnitList"
        );


      if (
        !button ||
        !info ||
        !unitList
      ) {

        return;

      }


      button.disabled =
        true;


      unitList.innerHTML =
        "";


      unitList.style.display =
        "none";


      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      if (
        !selectedMonth
      ) {

        info.textContent =
          "目前沒有可使用的盤點期間。";


        return;

      }


      const period =
        getSelectedPeriod(
          selectedMonth
        );


      if (!period) {

        info.textContent =
          "此月份尚未設定盤點期間。";


        return;

      }


      const countDate =
        String(
          period.count_date
        ).substring(
          0,
          10
        );


      const today =
        getLocalDateString();


      // =================================================
      // 必須是盤點當日
      // =================================================

      if (
        countDate !==
        today
      ) {

        info.textContent =
          `本月份盤點日期為 ${countDate}，僅限盤點當日 16:45 後產生通知。`;


        return;

      }


      // =================================================
      // 必須超過 16:45
      // =================================================

      if (
        !isAfter1645()
      ) {

        info.textContent =
          "盤點當日 16:45 後，才可選擇未盤點單位並產生通知。";


        return;

      }


      const pendingUnits =
        getPendingUnits(
          selectedMonth
        );


      // =================================================
      // 全部完成
      // =================================================

      if (
        pendingUnits.length === 0
      ) {

        info.textContent =
          "截至目前，所有單位均已完成本月份庫存盤點。";


        return;

      }


      // =================================================
      // 顯示未盤點單位勾選清單
      // =================================================

      info.textContent =
        `截至 16:45 後，尚有 ${pendingUnits.length} 個單位未完成盤點，請勾選本次需要傳真的單位。`;


      pendingUnits.forEach(
        unit => {

          const label =
            document.createElement(
              "label"
            );


          label.className =
            "fax-unit-item";


          const checkbox =
            document.createElement(
              "input"
            );


          checkbox.type =
            "checkbox";


          checkbox.value =
            unit;


          checkbox.addEventListener(
            "change",
            updateFaxButtonState
          );


          const text =
            document.createElement(
              "span"
            );


          text.textContent =
            unit;


          label.appendChild(
            checkbox
          );


          label.appendChild(
            text
          );


          unitList.appendChild(
            label
          );

        }
      );


      unitList.style.display =
        "grid";


      updateFaxButtonState();

    }


    // =====================================================
    // 判斷是否至少勾選一個單位
    // =====================================================

    function updateFaxButtonState() {

      const button =
        document.getElementById(
          "faxNotificationButton"
        );


      const checked =
        document.querySelectorAll(
          "#faxUnitList input[type='checkbox']:checked"
        );


      button.disabled =
        checked.length === 0;

    }


    // =====================================================
    // 取得使用者勾選的未盤點單位
    // =====================================================

    function getSelectedFaxUnits() {

      return [
        ...document.querySelectorAll(
          "#faxUnitList input[type='checkbox']:checked"
        )
      ].map(
        checkbox =>
          checkbox.value
      );

    }


    // =====================================================
    // 顯示單位
    // =====================================================

    function renderUnits(
      selectedMonth,
      selectedUnit
    ) {


      const container =
        document.getElementById(
          "unitContainer"
        );


      container.innerHTML =
        "";


      const monthData =
        getMonthData(
          selectedMonth
        );


      // =================================================
      // 尚未有任何盤點資料
      // =================================================

      if (
        monthData.length === 0
      ) {

        container.innerHTML =
          '<div class="no-data">本月份尚無盤點資料。</div>';


        return;

      }


      // =================================================
      // 單位仍以該月份實際資料為準
      // =================================================

      let units =
        [
          ...new Set(
            monthData.map(
              row =>
                row.unit_name
            )
          )
        ];


      if (
        selectedUnit !==
        "all"
      ) {

        units =
          units.filter(
            unit =>
              unit ===
              selectedUnit
          );

      }


      if (
        units.length === 0
      ) {

        container.innerHTML =
          '<div class="no-data">目前沒有符合條件的資料。</div>';


        return;

      }


      units.forEach(
        unit => {


          const unitRows =
            monthData.filter(
              row =>
                row.unit_name ===
                unit
            );


          const completedCount =
            unitRows.filter(
              row =>
                row.counted_quantity !==
                null
            ).length;


          const totalCount =
            6;


          const completed =
            completedCount ===
            totalCount;


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "unit-card";


          // ===============================================
          // 單位標題
          // ===============================================

          const header =
            document.createElement(
              "div"
            );


          header.className =
            "unit-header";


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "unit-info";


          const unitTitle =
            document.createElement(
              "span"
            );


          unitTitle.className =
            "unit-title";


          unitTitle.textContent =
            unit;


          const unitStatus =
            document.createElement(
              "span"
            );


          unitStatus.className =
            "unit-status";


          unitStatus.textContent =
            completed
              ? `${completedCount} / ${totalCount} 已完成`
              : `${completedCount} / ${totalCount} 尚未完成`;


          title.appendChild(
            unitTitle
          );


          title.appendChild(
            unitStatus
          );


          const arrow =
            document.createElement(
              "span"
            );


          arrow.className =
            "unit-arrow";


          arrow.textContent =
            "▶";


          header.appendChild(
            title
          );


          header.appendChild(
            arrow
          );


          // ===============================================
          // 表格內容
          // ===============================================

          const content =
            document.createElement(
              "div"
            );


          content.className =
            "unit-content";


          const table =
            document.createElement(
              "table"
            );


          table.innerHTML = `

            <thead>

              <tr>

                <th>耗材</th>

                <th>月初盤點</th>

                <th>配送異動</th>

                <th>廠商進貨</th>

                <th>應有庫存</th>

                <th>下月盤點</th>

                <th>差異</th>

              </tr>

            </thead>

            <tbody></tbody>

          `;


          const tbody =
            table.querySelector(
              "tbody"
            );


          unitRows.forEach(
            row => {


              const tr =
                document.createElement(
                  "tr"
                );


              const countedText =
                row.counted_quantity ===
                null
                  ? "尚未盤點"
                  : row.counted_quantity;


              const expectedText =
                row.expected_quantity ===
                null
                  ? "—"
                  : row.expected_quantity;


              const nextCountedText =
                row.next_counted_quantity ===
                null
                  ? "尚未盤點"
                  : row.next_counted_quantity;


              const differenceText =
                row.inventory_difference ===
                null
                  ? "—"
                  : row.inventory_difference;


              tr.innerHTML = `

                <td>
                  ${row.item_name}
                </td>

                <td class="number">
                  ${countedText}
                </td>

                <td class="number">
                  ${row.delivery_adjustment}
                </td>

                <td class="number">
                  ${row.purchase_quantity}
                </td>

                <td class="number">
                  ${expectedText}
                </td>

                <td class="number">
                  ${nextCountedText}
                </td>

                <td class="number">
                  ${differenceText}
                </td>

              `;


              tbody.appendChild(
                tr
              );

            }
          );


          content.appendChild(
            table
          );


          // ===============================================
          // 點擊展開／收合
          // ===============================================

          header.onclick =
            function() {


              const isOpen =
                content.classList.contains(
                  "open"
                );


              if (
                isOpen
              ) {

                content.classList.remove(
                  "open"
                );


                arrow.textContent =
                  "▶";


              } else {

                content.classList.add(
                  "open"
                );


                arrow.textContent =
                  "▼";

              }

            };


          card.appendChild(
            header
          );


          card.appendChild(
            content
          );


          container.appendChild(
            card
          );

        }
      );

    }


    // =====================================================
    // 建立 QR Code
    // =====================================================

    function createQRCode(
      container
    ) {

      return new Promise(
        resolve => {

          container.innerHTML =
            "";


          const qr =
            new QRCode(
              container,
              {
                text:
                  INVENTORY_SYSTEM_URL,

                width:
                  300,

                height:
                  300,

                correctLevel:
                  QRCode.CorrectLevel.H
              }
            );


          setTimeout(
            () => {

              resolve(
                qr
              );

            },
            300
          );

        }
      );

    }

    // 注意：

          <div class="pdf-brand">
            淡水信用合作社
          </div>

          <div class="pdf-title">
            庫存盤點未完成通知
          </div>

        </div>


        <div class="pdf-date-box">

          盤點日期：
          ${countDate}

          <br>

          通知時間：
          下午 4 時 45 分

        </div>


        <div class="pdf-body">

          <p>
            本社本月份庫存盤點日期為 ${countDate}。
          </p>

          <p>
            截至下午 4 時 45 分止，貴單位尚未完成本月份庫存盤點填報。

    // =====================================================
    // 產生未盤點傳真通知 PDF
    //
    // ★ 測試版：
    //
    // 勾選幾個單位，
    // 就產生幾頁。
    //
    // 例如：
    // 勾選營業部、水碓分社、竹圍分社
    // → 產生一個 PDF
    // → PDF 共 3 頁
    //
    // 每頁內容相同，
    // 但系統內部知道第幾頁對應哪個單位。
    //
    // PDF 本身不顯示：
    // - 單位名稱
    // - 傳真號碼
    // =====================================================

    async function generateFaxNotificationPDF() {

      const button =
        document.getElementById(
          "faxNotificationButton"
        );


      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      // =================================================
      // 取得使用者勾選的單位
      // =================================================

      const selectedFaxUnits =
        getSelectedFaxUnits();


      if (
        selectedFaxUnits.length === 0
      ) {

        alert(
          "請先勾選本次需要傳真的未盤點單位。"
        );


        return;

      }


      // =================================================
      // 再次確認盤點期間
      // =================================================

      const period =
        getSelectedPeriod(
          selectedMonth
        );


      if (!period) {

        alert(
          "找不到本月份盤點期間資料。"
        );


        return;

      }


      const countDate =
        String(
          period.count_date
        ).substring(
          0,
          10
        );


      // =================================================
      // 再次確認今天就是盤點日
      // =================================================

      if (
        countDate !==
        getLocalDateString()
      ) {

        alert(
          "目前不是本月份盤點日期，無法產生未盤點傳真通知。"
        );


        return;

      }


      // =================================================
      // 再次確認已經到 16:45
      // =================================================

      if (
        !isAfter1645()
      ) {

        alert(
          "目前尚未到 16:45，無法產生未盤點傳真通知。"
        );


        return;

      }


      // =================================================
      // 再次確認勾選的單位目前仍屬未完成
      // =================================================

      const currentPendingUnits =
        getPendingUnits(
          selectedMonth
        );


      const invalidSelectedUnits =
        selectedFaxUnits.filter(
          unit =>
            !currentPendingUnits.includes(
              unit
            )
        );


      if (
        invalidSelectedUnits.length > 0
      ) {

        alert(
          "部分勾選單位目前已完成盤點，請重新確認後再產生通知。"
        );


        updateFaxNotificationButton();


        return;

      }


      // =================================================
      // 防止重複點擊
      // =================================================

      button.disabled =
        true;


      const originalText =
        button.textContent;


      button.textContent =
        "PDF 產生中，請稍候……";


      try {


        // =================================================
        // 清除舊的 PDF 頁面
        // =================================================

        const pdfContainer =
          document.getElementById(
            "pdfPagesContainer"
          );


        pdfContainer.innerHTML =
          "";


        // =================================================
        // 建立 jsPDF
        // =================================================

        const {
          jsPDF
        } =
          window.jspdf;


        const pdf =
          new jsPDF(
            {
              orientation:
                "portrait",

              unit:
                "mm",

              format:
                "a4"
            }
          );


        // =================================================
        // ★ 一個單位建立一頁
        // =================================================

        for (
          let index = 0;
          index < selectedFaxUnits.length;
          index++
        ) {


          const unit =
            selectedFaxUnits[index];


          console.log(
            `正在建立第 ${index + 1} 頁，對應單位：${unit}`
          );


          const page =
            await createPDFPage(
              countDate
            );


          const canvas =
            await html2canvas(
              page,
              {
                scale:
                  2,

                useCORS:
                  true,

                backgroundColor:
                  "#ffffff"
              }
            );


          const imageData =
            canvas.toDataURL(
              "image/jpeg",
              0.95
            );


          // =================================================
          // 第一頁使用 jsPDF 建立時已存在
          // 後續頁面先新增
          // =================================================

          if (
            index > 0
          ) {

            pdf.addPage();

          }


          pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            210,
            297,
            undefined,
            "FAST"
          );

        }


        // =================================================
        // 產生檔案名稱
        // =================================================

        const filename =
          "庫存盤點未完成通知_" +
          countDate +
          ".pdf";


        // =================================================
        // 下載 PDF
        // =================================================

        pdf.save(
          filename
        );


        document.getElementById(
          "faxNotificationInfo"
        ).textContent =
          `已產生 ${selectedFaxUnits.length} 頁通知 PDF，本次選擇 ${selectedFaxUnits.length} 個單位傳真。`;


      } catch (error) {

        console.error(
          "PDF 產生失敗：",
          error
        );


        alert(
          "PDF 產生失敗，請稍後再試。"
        );


      } finally {

        button.disabled =
          false;


        button.textContent =
          originalText;


        document.getElementById(
          "pdfPagesContainer"
        ).innerHTML =
          "";

      }

    }


    // =====================================================
    // 月份切換
    // =====================================================

    document.getElementById(
      "monthSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 單位切換
    // =====================================================

    document.getElementById(
      "unitSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 未盤點傳真通知按鈕
    // =====================================================
