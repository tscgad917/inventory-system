<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存統計</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #333;
    }

    .message {
      margin: 20px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    .number {
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="admin-home.html" class="back">← 返回後台</a>

    <h1>庫存統計</h1>
<div style="margin: 20px 0;">
  <label for="monthSelect" style="font-weight: bold;">盤點月份：</label>
  <select id="monthSelect" style="padding: 8px; margin-left: 8px;">
  </select>
</div>
    <div id="message" class="message">
      資料載入中……
    </div>
<div id="countProgress" class="count-progress">
  本月盤點進度：讀取中……
</div>
    <table id="inventoryTable" style="display:none;">
      <thead>
        <tr>
          <th>單位</th>
          <th>耗材</th>
          <th>月初盤點</th>
          <th>配送異動</th>
          <th>廠商進貨</th>
          <th>應有庫存</th>
        </tr>
      </thead>

      <tbody id="inventoryBody"></tbody>
    </table>

  </div>

  <script>
    const accessToken = localStorage.getItem("admin_access_token");

    if (!accessToken) {
      window.location.href = "admin.html";
    }

    const SUPABASE_URL = "https://onebxqajsiqmhfcizaxl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";

    async function loadInventory() {

      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/inventory_expected?select=*",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + accessToken
            }
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          document.getElementById("message").textContent =
            "庫存資料讀取失敗。";
          return;
        }

        const data = await response.json();
const months = [...new Set(
  data.map(row => row.count_date)
)].sort().reverse();

const monthSelect = document.getElementById("monthSelect");

monthSelect.innerHTML = "";

months.forEach(month => {
  const option = document.createElement("option");
  option.value = month;

  const date = new Date(month);
  option.textContent =
    date.getFullYear() + "年" +
    (date.getMonth() + 1) + "月";

  monthSelect.appendChild(option);
});
        const tbody = document.getElementById("inventoryBody");

        tbody.innerHTML = "";

        if (data.length === 0) {
          document.getElementById("message").textContent =
            "目前尚無庫存統計資料。";
          return;
        }

        const selectedMonth = monthSelect.value;

const filteredData = data.filter(row =>
  row.count_date === selectedMonth
);

filteredData.forEach(row => {

          const tr = document.createElement("tr");

          const countedText =
  row.counted_quantity === null
    ? "尚未盤點"
    : row.counted_quantity;

const expectedText =
  row.expected_quantity === null
    ? "—"
    : row.expected_quantity;

tr.innerHTML = `
  <td>${row.unit_name}</td>
  <td>${row.item_name}</td>
  <td class="number">${countedText}</td>
  <td class="number">${row.delivery_adjustment}</td>
  <td class="number">${row.purchase_quantity}</td>
  <td class="number">${expectedText}</td>
`;

          tbody.appendChild(tr);

        });

        document.getElementById("message").style.display = "none";
        document.getElementById("inventoryTable").style.display = "table";
monthSelect.onchange = function() {
  const selectedMonth = this.value;

  tbody.innerHTML = "";

data
  .filter(row => row.count_date === selectedMonth)
  .forEach(row => {
    const tr = document.createElement("tr");

    const countedText =
      row.counted_quantity === null
        ? "尚未盤點"
        : row.counted_quantity;

    const expectedText =
      row.expected_quantity === null
        ? "—"
        : row.expected_quantity;

    tr.innerHTML = `
      <td>${row.unit_name}</td>
      <td>${row.item_name}</td>
      <td class="number">${countedText}</td>
      <td class="number">${row.delivery_adjustment}</td>
      <td class="number">${row.purchase_quantity}</td>
      <td class="number">${expectedText}</td>
    `;

    tbody.appendChild(tr);
  });
};
      } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
          "系統連線失敗，請稍後再試。";
      }
    }

    loadInventory();
  </script>

</body>
</html>
