<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存統計</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #333;
    }

    .message {
      margin: 20px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    .filter-area {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-item label {
      font-weight: bold;
    }

    select {
      padding: 8px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: white;
    }

    .count-progress {
      margin: 20px 0 8px 0;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-weight: bold;
    }

    .pending-units {
      margin-bottom: 20px;
      padding: 10px 12px;
      color: #555;
    }

    .unit-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      background: white;
    }

    .unit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
      background: #f8f8f8;
      user-select: none;
    }

    .unit-header:hover {
      background: #f0f0f0;
    }

    .unit-title {
      font-size: 16px;
      font-weight: bold;
    }

    .unit-status {
      margin-left: 12px;
      color: #666;
      font-size: 14px;
      font-weight: normal;
    }

    .unit-arrow {
      font-size: 16px;
      margin-left: 12px;
    }

    .unit-content {
      display: none;
      padding: 0 12px 12px 12px;
      overflow-x: auto;
    }

    .unit-content.open {
      display: block;
    }

    table {
      width: 100%;
      min-width: 850px;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    .number {
      text-align: right;
    }

    .no-data {
      padding: 20px;
      text-align: center;
      color: #777;
    }
  </style>

</head>

<body>

  <div class="container">

    <a href="admin-home.html" class="back">← 返回後台</a>

    <h1>庫存統計</h1>

    <div class="filter-area">

      <div class="filter-item">
        <label for="monthSelect">
          盤點月份：
        </label>

        <select id="monthSelect"></select>
      </div>

      <div class="filter-item">
        <label for="unitSelect">
          查看單位：
        </label>

        <select id="unitSelect">
          <option value="all">全部單位</option>
        </select>
      </div>

    </div>

    <div id="message" class="message">
      資料載入中……
    </div>

    <div id="countProgress" class="count-progress">
      本月盤點進度：讀取中……
    </div>

    <div id="pendingUnits" class="pending-units">
    </div>

    <div id="unitContainer">
    </div>

  </div>

  <script>

    const accessToken =
      localStorage.getItem("admin_access_token");


    if (!accessToken) {
      window.location.href = "admin.html";
    }


    const SUPABASE_URL =
      "https://onebxqajsiqmhfcizaxl.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


    let inventoryData = [];


    // =====================================================
    // 載入資料
    // =====================================================

    async function loadInventory() {

      try {

        // =================================================
        // 讀取盤點期間
        // =================================================

        const periodResponse =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_periods?select=period_month,count_date,is_open,note&order=period_month.desc",
            {
              method: "GET",

              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + accessToken
              }
            }
          );


        if (!periodResponse.ok) {

          const errorText =
            await periodResponse.text();

          console.error(errorText);

          document.getElementById(
            "message"
          ).textContent =
            "盤點期間資料讀取失敗。";

          return;
        }


        const periods =
          await periodResponse.json();


        // =================================================
        // 讀取庫存統計資料
        // =================================================

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/inventory_expected?select=*",
            {
              method: "GET",

              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + accessToken
              }
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(errorText);

          document.getElementById(
            "message"
          ).textContent =
            "庫存資料讀取失敗。";

          return;
        }


        inventoryData =
          await response.json();
alert("庫存資料筆數：" + inventoryData.length + "\n第一筆日期：" + inventoryData[0]?.count_date);

        // =================================================
        // 建立月份選單
        //
        // 月份來源以 inventory_periods 為準
        // 這樣尚未產生盤點資料的月份也能出現
        // =================================================

        const periodMonths =
  periods
    .map(period => period.period_month)
    .filter(month => month);


const inventoryMonths =
  inventoryData
    .map(row =>
      row.count_date
        ? row.count_date.substring(0, 7)
        : null
    )
    .filter(month => month);


const months = [
  ...new Set([
    ...periodMonths,
    ...inventoryMonths
  ])
].sort().reverse();
console.log("periodMonths =", periodMonths);
console.log("inventoryMonths =", inventoryMonths);
console.log("months =", months);

        const monthSelect =
          document.getElementById("monthSelect");


        monthSelect.innerHTML = "";


        months.forEach(month => {

          const option =
            document.createElement("option");


          option.value = month;


          const [year, monthNumber] =
            month.split("-");


          option.textContent =
            year + "年" +
            Number(monthNumber) +
            "月";


          monthSelect.appendChild(option);

        });


        // =================================================
        // 建立單位選單
        //
        // 單位仍然以既有庫存資料為來源
        // 不改變原本 9 月資料的呈現方式
        // =================================================

        const units = [];


        inventoryData.forEach(row => {

          if (
            row.unit_name &&
            !units.includes(row.unit_name)
          ) {
            units.push(row.unit_name);
          }

        });


        const unitSelect =
          document.getElementById("unitSelect");


        unitSelect.innerHTML =
          '<option value="all">全部單位</option>';


        units.forEach(unit => {

          const option =
            document.createElement("option");


          option.value = unit;
          option.textContent = unit;


          unitSelect.appendChild(option);

        });


        // =================================================
        // 沒有任何盤點期間
        // =================================================

        if (months.length === 0) {

          document.getElementById(
            "message"
          ).textContent =
            "目前尚未建立任何盤點期間。";

          document.getElementById(
            "countProgress"
          ).textContent =
            "本月盤點進度：尚無資料";

          document.getElementById(
            "pendingUnits"
          ).textContent = "";

          document.getElementById(
            "unitContainer"
          ).innerHTML =
            '<div class="no-data">目前尚未建立盤點期間。</div>';

          return;
        }


        // =================================================
        // 第一次載入
        // =================================================

        updatePage();


        document.getElementById(
          "message"
        ).style.display = "none";


      } catch (error) {

        console.error(error);

        document.getElementById(
          "message"
        ).textContent =
          "系統連線失敗，請稍後再試。";

      }

    }


    // =====================================================
    // 更新整個頁面
    // =====================================================

    function updatePage() {

      const selectedMonth =
        document.getElementById(
          "monthSelect"
        ).value;


      const selectedUnit =
        document.getElementById(
          "unitSelect"
        ).value;


      updateProgress(
        selectedMonth
      );


      renderUnits(
        selectedMonth,
        selectedUnit
      );

    }


    // =====================================================
    // 更新盤點進度
    // =====================================================

    function updateProgress(
      selectedMonth
    ) {

      const monthData =
        inventoryData.filter(row =>
          row.count_date &&
          row.count_date.substring(0, 7) === selectedMonth
        );


      // =================================================
      // 這裡只使用「本月份實際存在的資料」
      // 不自行建立尚未盤點的單位
      // =================================================

      const allUnits =
        [...new Set(
          monthData.map(row =>
            row.unit_name
          )
        )];


      const completedUnits =
        allUnits.filter(unit => {

          const unitRows =
            monthData.filter(row =>
              row.unit_name === unit
            );


          return unitRows.length > 0 &&
            unitRows.length === 6 &&
            unitRows.every(row =>
              row.counted_quantity !== null
            );

        });


      const pendingUnits =
        allUnits.filter(
          unit =>
            !completedUnits.includes(unit)
        );


      // =================================================
      // 尚未有任何資料的月份
      // =================================================

      if (allUnits.length === 0) {

        document.getElementById(
          "countProgress"
        ).textContent =
          "本月盤點進度：尚無盤點資料";


        document.getElementById(
          "pendingUnits"
        ).textContent =
          "本月份尚未產生盤點資料";


        return;
      }


      document.getElementById(
        "countProgress"
      ).textContent =
        `本月盤點進度：${completedUnits.length} / ${allUnits.length} 個單位已完成`;


      document.getElementById(
        "pendingUnits"
      ).textContent =
        pendingUnits.length > 0
          ? "尚未盤點：" +
            pendingUnits.join("、")
          : "所有單位均已完成盤點";

    }


    // =====================================================
    // 顯示單位
    // =====================================================

    function renderUnits(
      selectedMonth,
      selectedUnit
    ) {

      const container =
        document.getElementById(
          "unitContainer"
        );


      container.innerHTML = "";


      const monthData =
        inventoryData.filter(row =>
          row.count_date &&
          row.count_date.substring(0, 7) === selectedMonth
        );


      // =================================================
      // 尚未有任何盤點資料
      // =================================================

      if (monthData.length === 0) {

        container.innerHTML =
          '<div class="no-data">本月份尚無盤點資料。</div>';

        return;
      }


      // =================================================
      // 單位仍以該月份實際資料為準
      // 保留原本 9 月資料的顯示方式
      // =================================================

      let units =
        [...new Set(
          monthData.map(row =>
            row.unit_name
          )
        )];


      if (selectedUnit !== "all") {

        units =
          units.filter(unit =>
            unit === selectedUnit
          );

      }


      if (units.length === 0) {

        container.innerHTML =
          '<div class="no-data">目前沒有符合條件的資料。</div>';

        return;
      }


      units.forEach(unit => {

        const unitRows =
          monthData.filter(row =>
            row.unit_name === unit
          );


        const completedCount =
          unitRows.filter(row =>
            row.counted_quantity !== null
          ).length;


        const totalCount = 6;


        const completed =
          completedCount === totalCount;


        const card =
          document.createElement("div");


        card.className =
          "unit-card";


        const header =
          document.createElement("div");


        header.className =
          "unit-header";


        const title =
          document.createElement("div");


        title.innerHTML = `
          <span class="unit-title">
            ${unit}
          </span>

          <span class="unit-status">
            ${
              completed
                ? `${completedCount} / ${totalCount} 已完成`
                : `${completedCount} / ${totalCount} 尚未完成`
            }
          </span>
        `;


        const arrow =
          document.createElement("span");


        arrow.className =
          "unit-arrow";


        arrow.textContent =
          "▶";


        header.appendChild(title);
        header.appendChild(arrow);


        const content =
          document.createElement("div");


        content.className =
          "unit-content";


        // ===============================================
        // 建立該單位的表格
        // ===============================================

        const table =
          document.createElement("table");


        table.innerHTML = `
          <thead>
            <tr>
              <th>耗材</th>
              <th>月初盤點</th>
              <th>配送異動</th>
              <th>廠商進貨</th>
              <th>應有庫存</th>
              <th>下月盤點</th>
              <th>差異</th>
            </tr>
          </thead>

          <tbody></tbody>
        `;


        const tbody =
          table.querySelector("tbody");


        unitRows.forEach(row => {

          const tr =
            document.createElement("tr");


          const countedText =
            row.counted_quantity === null
              ? "尚未盤點"
              : row.counted_quantity;


          const expectedText =
            row.expected_quantity === null
              ? "—"
              : row.expected_quantity;


          const nextCountedText =
            row.next_counted_quantity === null
              ? "尚未盤點"
              : row.next_counted_quantity;


          const differenceText =
            row.inventory_difference === null
              ? "—"
              : row.inventory_difference;


          tr.innerHTML = `
            <td>${row.item_name}</td>

            <td class="number">
              ${countedText}
            </td>

            <td class="number">
              ${row.delivery_adjustment}
            </td>

            <td class="number">
              ${row.purchase_quantity}
            </td>

            <td class="number">
              ${expectedText}
            </td>

            <td class="number">
              ${nextCountedText}
            </td>

            <td class="number">
              ${differenceText}
            </td>
          `;


          tbody.appendChild(tr);

        });


        content.appendChild(table);


        // ===============================================
        // 點擊展開／收合
        // ===============================================

        header.onclick =
          function() {

            const isOpen =
              content.classList.contains("open");


            if (isOpen) {

              content.classList.remove("open");

              arrow.textContent =
                "▶";

            } else {

              content.classList.add("open");

              arrow.textContent =
                "▼";

            }

          };


        card.appendChild(header);
        card.appendChild(content);


        container.appendChild(card);

      });

    }


    // =====================================================
    // 月份切換
    // =====================================================

    document.getElementById(
      "monthSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 單位切換
    // =====================================================

    document.getElementById(
      "unitSelect"
    ).onchange =
      function() {

        updatePage();

      };


    // =====================================================
    // 開始載入
    // =====================================================

    loadInventory();

  </script>

</body>
</html>
