<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總務課統一管理中心</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#243247;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#17365d;color:#fff;padding:22px 18px}
header .inner,main{max-width:980px;margin:auto}
h1{font-size:24px;margin:0 0 6px}
.sub{font-size:14px;opacity:.85}
main{padding:24px 16px 40px}
.welcome{background:#fff;border:1px solid #e0e7ef;border-radius:14px;padding:20px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{display:block;background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{border-color:#537da9;transform:translateY(-2px);box-shadow:0 5px 18px #17365d12}
.num{font-size:12px;color:#54708e;font-weight:700;letter-spacing:.08em}
.title{font-size:19px;font-weight:700;margin:10px 0}
.desc{font-size:14px;color:#607086;line-height:1.7}
.status{display:inline-block;font-size:12px;background:#e8f2ea;color:#28613c;border-radius:20px;padding:4px 9px;margin-top:14px}
.status.pending{background:#fff2d9;color:#8a5b00}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap;color:#718096;font-size:13px}
button{border:0;border-radius:8px;background:#17365d;color:white;padding:11px 18px;cursor:pointer;font-size:14px}
@media(max-width:520px){h1{font-size:21px}.card{padding:17px}}
</style>
</head>
<body>
<header><div class="inner"><h1>總務課統一管理中心</h1><div class="sub">登入一次，集中管理三套業務系統</div></div></header>
<main>
<section class="welcome">
<h2 id="welcomeTitle">正在確認管理員身分……</h2>
<div class="desc">請由下方選擇要管理的系統。請勿將管理頁面連結提供給未授權人員。</div>
</section>
<section class="grid">
<a class="card" href="admin-home.html" onclick="sessionStorage.setItem('inventoryAdminEntryTicket','from-center')">
<div class="num">SYSTEM 01</div><div class="title">庫存盤點管理</div>
<div class="desc">盤點期間設定、耗材配送、廠商進貨、盤點資料管理及庫存統計。</div>
<span class="status">現有功能</span>
</a>
<a class="card" href="../supply-request/admin.html" onclick="sessionStorage.setItem('voucherAdminEntryTicket','from-center')">
<div class="num">SYSTEM 02</div><div class="title">傳票耗材管理</div>
<div class="desc">申請紀錄、彙總表及傳票耗材批次管理。</div>
<span class="status">已接統一登入驗證</span>
</a>
<a class="card" href="../paper-demand-statistics/admin.html" onclick="sessionStorage.setItem('paperAdminEntryTicket','from-center')">
<div class="num">SYSTEM 03</div><div class="title">紙張需求管理</div>
<div class="desc">查看各季度、各單位申請紀錄，依季度或單位篩選。</div>
<span class="status">管理頁已建立，待測試資料權限</span>
</a>
</section>
<footer><span>管理帳號：<span id="adminEmail"></span></span><button type="button" id="logoutBtn">統一登出</button></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const URL="https://onebxqajsiqmhfcizaxl.supabase.co";
  const KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
  const ALLOWED="tscgad917@gmail.com";
  const $=id=>document.getElementById(id);
  const db=window.supabase.createClient(URL,KEY);

  async function init(){
    try{
      let result=await db.auth.getSession();
      if(result.error) throw result.error;
      let session=result.data&&result.data.session;

      // 相容舊版登入資訊；正常情況會直接讀到統一登入入口保存的 session。
      if(!session){
        const token=localStorage.getItem("admin_access_token");
        const refresh=localStorage.getItem("admin_refresh_token");
        const email=(localStorage.getItem("admin_email")||"").toLowerCase();
        if(!token||!refresh||email!==ALLOWED) throw new Error("找不到有效的登入狀態，請重新登入。");
        result=await db.auth.setSession({access_token:token,refresh_token:refresh});
        if(result.error) throw result.error;
        session=result.data&&result.data.session;
      }
      if(!session) throw new Error("未取得有效的登入 session。");

      const user=await db.auth.getUser();
      if(user.error) throw user.error;
      const email=(user.data.user.email||"").toLowerCase();
      if(email!==ALLOWED) throw new Error("目前帳號未獲授權使用管理中心。");

      localStorage.setItem("admin_access_token",session.access_token);
      localStorage.setItem("admin_refresh_token",session.refresh_token);
      localStorage.setItem("admin_email",email);
      $("welcomeTitle").textContent="您好，總務課管理人員";
      $("adminEmail").textContent=email;
    }catch(error){
      console.error("統一管理中心驗證失敗：",error);
      $("welcomeTitle").textContent="登入狀態失效";
      const note=document.createElement("div");
      note.className="desc";
      note.style.color="#b91c1c";
      note.textContent="無法確認登入狀態："+(error&&error.message?error.message:String(error))+"。請返回登入入口重新登入。";
      $("welcomeTitle").parentNode.appendChild(note);
      setTimeout(()=>window.location.replace("admin.html"),1800);
    }
  }

  $("logoutBtn").addEventListener("click",async function(){
    try{await db.auth.signOut();}catch(e){console.error("登出請求失敗",e);}
    ["admin_access_token","admin_refresh_token","admin_email"].forEach(k=>localStorage.removeItem(k));
    window.location.replace("admin.html");
  });

  init();
})();
</script>
</body>
</html>
