<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總務課統一管理中心</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#243247;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#17365d;color:#fff;padding:22px 18px}
header .inner,main{max-width:980px;margin:auto}
h1{font-size:24px;margin:0 0 6px}
.sub{font-size:14px;opacity:.85}
main{padding:24px 16px 40px}
.welcome{background:#fff;border:1px solid #e0e7ef;border-radius:14px;padding:20px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{display:block;background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:.15s}
.card:hover{border-color:#537da9;transform:translateY(-2px);box-shadow:0 5px 18px #17365d12}
.num{font-size:12px;color:#54708e;font-weight:700;letter-spacing:.08em}
.title{font-size:19px;font-weight:700;margin:10px 0}
.desc{font-size:14px;color:#607086;line-height:1.7}
.status{display:inline-block;font-size:12px;background:#e8f2ea;color:#28613c;border-radius:20px;padding:4px 9px;margin-top:14px}
.status.pending{background:#fff2d9;color:#8a5b00}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap;color:#718096;font-size:13px}
button{border:0;border-radius:8px;background:#17365d;color:white;padding:11px 18px;cursor:pointer;font-size:14px}
@media(max-width:520px){h1{font-size:21px}.card{padding:17px}}
</style>
</head>
<body>
<header><div class="inner"><h1>總務課統一管理中心</h1><div class="sub">登入一次，集中管理三套業務系統</div></div></header>
<main>
<section class="welcome">
<h2 id="welcomeTitle">正在確認管理員身分……</h2>
<div class="desc">請由下方選擇要管理的系統。請勿將管理頁面連結提供給未授權人員。</div>
</section>
<section class="grid">
<a class="card" href="admin-home.html">
<div class="num">SYSTEM 01</div><div class="title">庫存盤點管理</div>
<div class="desc">盤點期間設定、耗材配送、廠商進貨、盤點資料管理及庫存統計。</div>
<span class="status">現有功能</span>
</a>
<a class="card" href="../supply-request/admin.html">
<div class="num">SYSTEM 02</div><div class="title">傳票耗材管理</div>
<div class="desc">申請紀錄、彙總表及傳票耗材批次管理。</div>
<span class="status">已接統一登入驗證</span>
</a>
<div class="card" aria-disabled="true">
<div class="num">SYSTEM 03</div><div class="title">紙張需求管理</div>
<div class="desc">下一階段新增管理查詢頁，保留既有紙張需求填單前台及資料。</div>
<span class="status pending">管理頁建置中</span>
</div>
</section>
<footer><span>管理帳號：<span id="adminEmail"></span></span><button type="button" id="logoutBtn">統一登出</button></footer>
</main>
<script>
(function(){
  "use strict";
  var token=localStorage.getItem("admin_access_token");
  var email=(localStorage.getItem("admin_email")||"").toLowerCase();
  var allowed="tscgad917@gmail.com";
  if(!token || email!==allowed){
    window.location.replace("admin.html");
    return;
  }
  document.getElementById("welcomeTitle").textContent="您好，總務課管理人員";
  document.getElementById("adminEmail").textContent=email;
  document.getElementById("logoutBtn").addEventListener("click",async function(){
    try{
      await fetch("https://onebxqajsiqmhfcizaxl.supabase.co/auth/v1/logout",{
        method:"POST",
        headers:{
          "apikey":"sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq",
          "Authorization":"Bearer "+token
        }
      });
    }catch(e){console.error("登出請求失敗",e);}
    ["admin_access_token","admin_refresh_token","admin_email"].forEach(function(k){localStorage.removeItem(k);});
    window.location.replace("admin.html");
  });
  fetch("https://onebxqajsiqmhfcizaxl.supabase.co/auth/v1/user",{
    headers:{
      "apikey":"sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq",
      "Authorization":"Bearer "+token
    }
  }).then(function(r){
    if(!r.ok) throw new Error("登入已失效");
    return r.json();
  }).then(function(user){
    if((user.email||"").toLowerCase()!==allowed) throw new Error("管理帳號未獲授權");
  }).catch(function(){
    ["admin_access_token","admin_refresh_token","admin_email"].forEach(function(k){localStorage.removeItem(k);});
    window.location.replace("admin.html");
  });
})();
</script>
</body>
</html>
