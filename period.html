<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盤點期間設定｜庫存盤點系統</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .back-button {
      background: #777;
      margin-top: 30px;
    }

    .cancel-button {
      background: #777;
      display: none;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      background: #f5f5f5;
      color: #555;
      line-height: 1.6;
    }

    .period-list {
      margin-top: 35px;
    }

    .period-list h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .period-row {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .period-row div {
      margin-bottom: 7px;
    }

    .open {
      color: #287a28;
      font-weight: bold;
    }

    .closed {
      color: #a33;
      font-weight: bold;
    }

    .edit-button {
      background: #555;
      margin-top: 15px;
      padding: 9px;
      font-size: 15px;
    }

    .delete-button {
      background: #999;
      margin-top: 10px;
      padding: 9px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>盤點期間設定</h1>

  <div class="subtitle">
    庫存盤點系統｜總務課管理後台
  </div>

  <label for="periodMonth">盤點月份</label>
  <input type="month" id="periodMonth">

  <label for="countDate">實際盤點日</label>
  <input type="date" id="countDate">

  <label for="isOpen">開放狀態</label>
  <select id="isOpen">
    <option value="false">未開放</option>
    <option value="true">開放</option>
  </select>

  <label for="note">備註</label>
  <input
    type="text"
    id="note"
    placeholder="例如：11/1假日，改於11/2盤點"
  >

  <button type="button" id="saveButton">
    儲存盤點期間
  </button>

  <button type="button" id="cancelButton" class="cancel-button">
    取消編輯
  </button>

  <div id="status" class="status">
    請輸入盤點期間資料。
  </div>

  <div class="period-list">

    <h2>已設定的盤點期間</h2>

    <div id="periodList">
      正在讀取……
    </div>

  </div>

  <button type="button" class="back-button" id="backButton">
    返回管理首頁
  </button>

</div>

<script>
const SUPABASE_URL = "https://onebxqajsiqmhfcizaxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";

const accessToken = localStorage.getItem("admin_access_token");

let editingId = null;

if (!accessToken) {
  window.location.href = "admin.html";
}

const periodMonthInput = document.getElementById("periodMonth");
const countDateInput = document.getElementById("countDate");
const isOpenInput = document.getElementById("isOpen");
const noteInput = document.getElementById("note");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");
const statusBox = document.getElementById("status");
const periodList = document.getElementById("periodList");
const backButton = document.getElementById("backButton");


async function loadPeriods() {
  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/inventory_periods" +
      "?select=id,period_month,count_date,is_open,note" +
      "&order=period_month.asc",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error("讀取失敗：", errorText);
      periodList.textContent = "盤點期間資料讀取失敗。";
      return;
    }

    const periods = await response.json();

    periodList.innerHTML = "";

    if (periods.length === 0) {
      periodList.textContent = "目前尚未設定盤點期間。";
      return;
    }

    periods.forEach(function(period) {
      const row = document.createElement("div");
      row.className = "period-row";

      const monthDiv = document.createElement("div");
      monthDiv.textContent = "盤點月份：" + period.period_month;

      const dateDiv = document.createElement("div");
      dateDiv.textContent = "實際盤點日：" + period.count_date;

      const statusDiv = document.createElement("div");

      const statusLabel = document.createElement("strong");
      statusLabel.textContent = "狀態：";

      const statusText = document.createElement("span");
      statusText.textContent = period.is_open ? "開放" : "未開放";
      statusText.className = period.is_open ? "open" : "closed";

      statusDiv.appendChild(statusLabel);
      statusDiv.appendChild(statusText);

      const noteDiv = document.createElement("div");
      noteDiv.textContent = "備註：" + (period.note || "－");

      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "edit-button";
      editButton.textContent = "編輯";

      editButton.addEventListener("click", function() {
        startEdit(period);
      });

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-button";
      deleteButton.textContent = "刪除此設定";

      deleteButton.addEventListener("click", function() {
        deletePeriod(period.id);
      });

      row.appendChild(monthDiv);
      row.appendChild(dateDiv);
      row.appendChild(statusDiv);
      row.appendChild(noteDiv);
      row.appendChild(editButton);
      row.appendChild(deleteButton);

      periodList.appendChild(row);
    });

  } catch (error) {
    console.error(error);
    periodList.textContent = "系統連線失敗，請稍後再試。";
  }
}


function startEdit(period) {
  editingId = period.id;

  periodMonthInput.value = period.period_month.substring(0, 7);
  periodMonthInput.disabled = true;

  countDateInput.value = period.count_date;
  isOpenInput.value = period.is_open ? "true" : "false";
  noteInput.value = period.note || "";

  saveButton.textContent = "儲存修改";
  cancelButton.style.display = "block";

  statusBox.textContent = "目前正在編輯盤點期間。";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


async function savePeriod() {
  const periodMonth = periodMonthInput.value;
  const countDate = countDateInput.value;
  const isOpen = isOpenInput.value === "true";
  const note = noteInput.value.trim();

  if (!periodMonth) {
    statusBox.textContent = "請選擇盤點月份。";
    return;
  }

  if (!countDate) {
    statusBox.textContent = "請設定實際盤點日。";
    return;
  }

  if (editingId !== null) {
    await updatePeriod(
      editingId,
      countDate,
      isOpen,
      note
    );
    return;
  }

  const data = {
    period_month: periodMonth + "-01",
    count_date: countDate,
    is_open: isOpen,
    note: note || null
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/inventory_periods",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error("新增失敗：", errorText);
      statusBox.textContent = "新增失敗：" + errorText;
      return;
    }

    statusBox.textContent = "盤點期間已成功儲存。";

    clearForm();
    await loadPeriods();

  } catch (error) {
    console.error(error);
    statusBox.textContent = "系統連線失敗，請稍後再試。";
  }
}


async function updatePeriod(id, countDate, isOpen, note) {
  const data = {
    count_date: countDate,
    is_open: isOpen,
    note: note || null
  };

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/inventory_periods?id=eq." +
      id,
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error("修改失敗：", errorText);
      statusBox.textContent = "修改失敗：" + errorText;
      return;
    }

    statusBox.textContent = "盤點期間已成功修改。";

    clearForm();
    await loadPeriods();

  } catch (error) {
    console.error(error);
    statusBox.textContent = "系統連線失敗，請稍後再試。";
  }
}


function cancelEdit() {
  clearForm();
  statusBox.textContent = "已取消編輯。";
}


function clearForm() {
  editingId = null;

  periodMonthInput.value = "";
  periodMonthInput.disabled = false;

  countDateInput.value = "";
  isOpenInput.value = "false";
  noteInput.value = "";

  saveButton.textContent = "儲存盤點期間";
  cancelButton.style.display = "none";
}


async function deletePeriod(id) {
  const confirmed = confirm(
    "確定要刪除這筆盤點期間設定嗎？"
  );

  if (!confirmed) {
    return;
  }

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/inventory_periods?id=eq." +
      id,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error("刪除失敗：", errorText);
      alert("刪除失敗，請通知總務課處理。");
      return;
    }

    alert("盤點期間已刪除。");

    await loadPeriods();

  } catch (error) {
    console.error(error);
    alert("系統連線失敗，請稍後再試。");
  }
}


saveButton.addEventListener("click", savePeriod);

cancelButton.addEventListener("click", cancelEdit);

backButton.addEventListener("click", function() {
  window.location.href = "admin-home.html";
});

loadPeriods();
</script>

</body>
</html>
