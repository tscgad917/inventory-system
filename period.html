<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盤點期間設定｜庫存盤點系統</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .back-button {
      background: #777;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      background: #f5f5f5;
      color: #555;
      line-height: 1.6;
    }

    .period-list {
      margin-top: 35px;
    }

    .period-list h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .period-row {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .period-row div {
      margin-bottom: 6px;
    }

    .period-row div:last-of-type {
      margin-bottom: 0;
    }

    .open {
      color: #287a28;
      font-weight: bold;
    }

    .closed {
      color: #a33;
      font-weight: bold;
    }

    .edit-button {
      background: #555;
      margin-top: 15px;
      padding: 9px;
      font-size: 15px;
    }

    .delete-button {
      background: #999;
      margin-top: 10px;
      padding: 9px;
      font-size: 15px;
    }

    .cancel-button {
      background: #777;
      margin-top: 10px;
      display: none;
    }

    .edit-mode {
      background: #f0f4f8;
      border: 2px solid #777;
    }
  </style>

</head>

<body>

<div class="container">

  <h1>盤點期間設定</h1>

  <div class="subtitle">
    庫存盤點系統｜總務課管理後台
  </div>

<label for="periodMonth">盤點月份</label> <input type="month" id="periodMonth">

<label for="countDate">實際盤點日</label> <input type="date" id="countDate">

<label for="isOpen">開放狀態</label> <select id="isOpen"> <option value="false">未開放</option> <option value="true">開放</option> </select>

<label for="note">備註</label>
<input
type="text"
id="note"
placeholder="例如：11/1假日，改於11/2盤點"

>

  <button type="button" id="saveButton" onclick="savePeriod()">
    儲存盤點期間
  </button>

<button
type="button"
id="cancelButton"
class="cancel-button"
onclick="cancelEdit()"

>

```
取消編輯
```

  </button>

  <div id="status" class="status">
    請輸入盤點期間資料。
  </div>

  <div class="period-list">

```
<h2>已設定的盤點期間</h2>

<div id="periodList">
  正在讀取……
</div>
```

  </div>

<button
type="button"
class="back-button"
onclick="location.href='admin-home.html'"

>

```
返回管理首頁
```

  </button>

</div>

<script>

const SUPABASE_URL =
  "https://onebxqajsiqmhfcizaxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";

const accessToken =
  localStorage.getItem("admin_access_token");

let editingId = null;


// --------------------------------------------------
// 登入檢查
// --------------------------------------------------

if (!accessToken) {
  window.location.href = "admin.html";
}


// --------------------------------------------------
// 讀取盤點期間
// --------------------------------------------------

async function loadPeriods() {

  const periodList =
    document.getElementById("periodList");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/inventory_periods" +
      "?select=id,period_month,count_date,is_open,note" +
      "&order=period_month.asc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(errorText);

      periodList.innerHTML =
        "<div>盤點期間資料讀取失敗。</div>";

      return;
    }

    const periods =
      await response.json();

    if (periods.length === 0) {

      periodList.innerHTML =
        "<div>目前尚未設定盤點期間。</div>";

      return;
    }

    periodList.innerHTML = "";

    periods.forEach(function(period) {

      const row =
        document.createElement("div");

      row.className = "period-row";

      const statusText =
        period.is_open
          ? "開放"
          : "未開放";

      const statusClass =
        period.is_open
          ? "open"
          : "closed";

      row.innerHTML = `

        <div>
          <strong>盤點月份：</strong>
          ${period.period_month}
        </div>

        <div>
          <strong>實際盤點日：</strong>
          ${period.count_date}
        </div>

        <div>
          <strong>狀態：</strong>
          <span class="${statusClass}">
            ${statusText}
          </span>
        </div>

        <div>
          <strong>備註：</strong>
          ${period.note || "－"}
        </div>

        <button
          type="button"
          class="edit-button"
          onclick="editPeriod(
            ${period.id},
            '${period.period_month}',
            '${period.count_date}',
            ${period.is_open},
            ${JSON.stringify(period.note || "")}
          )"
        >
          編輯
        </button>

        <button
          type="button"
          class="delete-button"
          onclick="deletePeriod(${period.id})"
        >
          刪除此設定
        </button>

      `;

      periodList.appendChild(row);

    });

  } catch (error) {

    console.error(error);

    periodList.innerHTML =
      "<div>系統連線失敗，請稍後再試。</div>";
  }
}


// --------------------------------------------------
// 新增盤點期間
// --------------------------------------------------

async function savePeriod() {

  const periodMonth =
    document.getElementById("periodMonth").value;

  const countDate =
    document.getElementById("countDate").value;

  const isOpen =
    document.getElementById("isOpen").value === "true";

  const note =
    document.getElementById("note").value.trim();

  const status =
    document.getElementById("status");

  if (!periodMonth) {

    status.textContent =
      "請選擇盤點月份。";

    return;
  }

  if (!countDate) {

    status.textContent =
      "請設定實際盤點日。";

    return;
  }


  // ------------------------------------------------
  // 編輯模式
  // ------------------------------------------------

  if (editingId !== null) {

    await updatePeriod(
      editingId,
      countDate,
      isOpen,
      note
    );

    return;
  }


  // ------------------------------------------------
  // 新增模式
  // ------------------------------------------------

  const periodMonthDate =
    periodMonth + "-01";

  const data = {

    period_month:
      periodMonthDate,

    count_date:
      countDate,

    is_open:
      isOpen,

    note:
      note || null

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "儲存失敗：",
        errorText
      );

      status.textContent =
        "儲存失敗：" + errorText;

      return;
    }


    status.textContent =
      "盤點期間已成功儲存。";

    clearForm();

    loadPeriods();

  } catch (error) {

    console.error(error);

    status.textContent =
      "系統連線失敗，請稍後再試。";
  }
}


// --------------------------------------------------
// 進入編輯模式
// --------------------------------------------------

function editPeriod(
  id,
  periodMonth,
  countDate,
  isOpen,
  note
) {

  editingId = id;

  document.getElementById("periodMonth").value =
    periodMonth.substring(0, 7);

  document.getElementById("periodMonth").disabled =
    true;

  document.getElementById("countDate").value =
    countDate;

  document.getElementById("isOpen").value =
    isOpen ? "true" : "false";

  document.getElementById("note").value =
    note || "";

  document.getElementById("saveButton").textContent =
    "儲存修改";

  document.getElementById("cancelButton").style.display =
    "block";

  document.getElementById("status").textContent =
    "目前正在編輯盤點期間。";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


// --------------------------------------------------
// 更新盤點期間
// --------------------------------------------------

async function updatePeriod(
  id,
  countDate,
  isOpen,
  note
) {

  const status =
    document.getElementById("status");

  const data = {

    count_date:
      countDate,

    is_open:
      isOpen,

    note:
      note || null

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods?id=eq." + id,
        {
          method: "PATCH",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(data)
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "修改失敗：",
        errorText
      );

      status.textContent =
        "修改失敗：" + errorText;

      return;
    }


    status.textContent =
      "盤點期間已成功修改。";

    clearForm();

    loadPeriods();

  } catch (error) {

    console.error(error);

    status.textContent =
      "系統連線失敗，請稍後再試。";
  }
}


// --------------------------------------------------
// 取消編輯
// --------------------------------------------------

function cancelEdit() {

  editingId = null;

  clearForm();

  document.getElementById("status").textContent =
    "已取消編輯。";
}


// --------------------------------------------------
// 清除表單
// --------------------------------------------------

function clearForm() {

  editingId = null;

  document.getElementById("periodMonth").value =
    "";

  document.getElementById("periodMonth").disabled =
    false;

  document.getElementById("countDate").value =
    "";

  document.getElementById("isOpen").value =
    "false";

  document.getElementById("note").value =
    "";

  document.getElementById("saveButton").textContent =
    "儲存盤點期間";

  document.getElementById("cancelButton").style.display =
    "none";
}


// --------------------------------------------------
// 刪除盤點期間
// --------------------------------------------------

async function deletePeriod(id) {

  const confirmed =
    confirm(
      "確定要刪除這筆盤點期間設定嗎？"
    );

  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods?id=eq." + id,
        {
          method: "DELETE",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(errorText);

      alert(
        "刪除失敗，請通知總務課處理。"
      );

      return;
    }


    alert(
      "盤點期間已刪除。"
    );

    loadPeriods();

  } catch (error) {

    console.error(error);

    alert(
      "系統連線失敗，請稍後再試。"
    );
  }
}


// --------------------------------------------------
// 初始載入
// --------------------------------------------------

loadPeriods();

</script>

</body>
</html>
