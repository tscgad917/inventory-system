<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盤點期間設定｜庫存盤點系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f6f3;
      color: #26332c;
    }

    .page-header {
      background: #14532d;
      color: white;
      padding: 22px 24px;
      box-shadow: 0 2px 8px rgba(20, 83, 45, 0.12);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    .system-name {
      font-size: 14px;
      letter-spacing: 0.08em;
      opacity: 0.88;
      margin-bottom: 5px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .container {
      max-width: 820px;
      margin: 38px auto 60px;
      padding: 0 24px;
    }

    .page-intro {
      margin-bottom: 24px;
    }

    .page-intro h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #174c2d;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 0;
      color: #6d7971;
      font-size: 14px;
      line-height: 1.7;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(31, 55, 40, 0.05);
    }

    .card-title {
      margin: 0 0 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e4ebe6;
      font-size: 18px;
      font-weight: 600;
      color: #245337;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 22px;
    }

    .form-group {
      min-width: 0;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #34443a;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      font-family: inherit;
      font-size: 15px;
      color: #26332c;
      background: #ffffff;
      border: 1px solid #cfd9d2;
      border-radius: 8px;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    input::placeholder {
      color: #a1aaa4;
    }

    input:focus,
    select:focus {
      border-color: #57916c;
      box-shadow: 0 0 0 3px rgba(87, 145, 108, 0.12);
    }

    input:disabled {
      background: #f1f4f2;
      color: #78837c;
      cursor: not-allowed;
    }

    .helper-text {
      margin-top: 6px;
      font-size: 12px;
      color: #818b84;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .primary-button,
    .secondary-button,
    .back-button,
    .edit-button,
    .delete-button,
    .notify-button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .primary-button {
      flex: 1;
      padding: 13px 18px;
      border: none;
      background: #17613a;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    .primary-button:hover {
      background: #124f2f;
      box-shadow: 0 3px 8px rgba(23, 97, 58, 0.18);
    }

    .secondary-button {
      flex: 0 0 120px;
      padding: 13px 18px;
      border: 1px solid #bfcac2;
      background: #ffffff;
      color: #536159;
      font-size: 15px;
      font-weight: 500;
      display: none;
    }

    .secondary-button:hover {
      background: #f4f7f4;
      border-color: #9eaea3;
    }

    button:disabled {
      background: #aeb7b1;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid #d8e8dc;
      border-radius: 8px;
      background: #edf5ef;
      color: #5f7065;
      font-size: 13px;
      line-height: 1.6;
    }

    .period-list {
      margin-top: 30px;
    }

    .period-list-title {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 600;
      color: #245337;
    }

    .period-row {
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(31, 55, 40, 0.04);
    }

    .period-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
      margin-bottom: 16px;
    }

    .info-item {
      min-width: 0;
    }

    .info-label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #7b867f;
    }

    .info-value {
      font-size: 15px;
      color: #34443a;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .open {
      background: #e6f2e9;
      color: #17613a;
    }

    .closed {
      background: #f1f2f1;
      color: #707872;
    }

    .period-actions {
      display: flex;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid #e8ede9;
      flex-wrap: wrap;
    }

    .edit-button,
    .delete-button,
    .notify-button {
      padding: 9px 16px;
      font-size: 14px;
    }

    .edit-button {
      border: 1px solid #a9c5b1;
      background: #f5f9f6;
      color: #28603d;
    }

    .edit-button:hover {
      background: #eaf3ed;
      border-color: #8fb39a;
    }

    .delete-button {
      border: 1px solid #decaca;
      background: #fffafa;
      color: #9a5f5f;
    }

    .delete-button:hover {
      background: #fdf1f1;
      border-color: #d0aaaa;
    }

    .notify-button {
      border: 1px solid #a9c5b1;
      background: #edf6ef;
      color: #17613a;
      font-weight: 600;
    }

    .notify-button:hover {
      background: #e1f0e5;
      border-color: #8fb39a;
    }

    .back-area {
      margin-top: 28px;
      text-align: center;
    }

    .back-button {
      width: 100%;
      padding: 13px 18px;
      border: 1px solid #c6d0c9;
      background: #ffffff;
      color: #536159;
      font-size: 15px;
    }

    .back-button:hover {
      background: #f5f7f5;
      border-color: #aebbb2;
    }

    /* ===== 通知視窗 ===== */

    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(28, 42, 34, 0.38);
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(31, 55, 40, 0.16);
    }

    .modal-title {
      margin: 0 0 8px;
      color: #245337;
      font-size: 20px;
      font-weight: 600;
    }

    .modal-description {
      margin: 0 0 18px;
      color: #68756d;
      font-size: 14px;
      line-height: 1.7;
    }

    .recipient-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .recipient-count {
      font-size: 13px;
      color: #68756d;
    }

    .select-all-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-size: 14px;
      color: #34443a;
      cursor: pointer;
    }

    .recipient-list {
      border: 1px solid #dfe7e1;
      border-radius: 8px;
      background: #fafcfb;
      padding: 8px;
    }

    .recipient-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .recipient-item:hover {
      background: #f0f5f1;
    }

    .recipient-item input {
      width: auto;
      margin-top: 3px;
    }

    .recipient-text {
      min-width: 0;
    }

    .recipient-unit {
      display: block;
      color: #34443a;
      font-size: 14px;
      font-weight: 600;
    }

    .recipient-email {
      display: block;
      margin-top: 2px;
      color: #7b867f;
      font-size: 12px;
      word-break: break-all;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-cancel,
    .modal-confirm {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-cancel {
      border: 1px solid #c6d0c9;
      background: #ffffff;
      color: #536159;
    }

    .modal-confirm {
      border: none;
      background: #17613a;
      color: #ffffff;
    }

    .modal-confirm:hover {
      background: #124f2f;
    }

    .modal-cancel:hover {
      background: #f5f7f5;
    }

    @media (max-width: 650px) {

      .page-header {
        padding: 18px 20px;
      }

      .header-title {
        font-size: 20px;
      }

      .container {
        margin-top: 28px;
        padding: 0 16px;
      }

      .page-intro h1 {
        font-size: 23px;
      }

      .card {
        padding: 22px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .form-group.full {
        grid-column: auto;
      }

      .period-info {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      .secondary-button {
        flex: auto;
        width: 100%;
      }

      .period-actions {
        flex-direction: column;
      }

      .edit-button,
      .delete-button,
      .notify-button {
        width: 100%;
      }

      .modal {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header class="page-header">
  <div class="header-inner">

    <div class="system-name">
      淡水信用合作社
    </div>

    <div class="header-title">
      庫存盤點系統
    </div>

  </div>
</header>


<main class="container">

  <div class="page-intro">

    <h1>
      盤點期間設定
    </h1>

    <p class="subtitle">
      設定各月份實際盤點日期及盤點開放狀態。
    </p>

  </div>


  <!-- 新增／編輯區 -->

  <section class="card">

    <h2 class="card-title">
      盤點期間資料
    </h2>


    <div class="form-grid">

      <div class="form-group">

        <label for="periodMonth">
          盤點月份
        </label>

        <input
          type="month"
          id="periodMonth"
        >

        <div class="helper-text">
          請選擇本次盤點所屬月份。
        </div>

      </div>


      <div class="form-group">

        <label for="countDate">
          實際盤點日
        </label>

        <input
          type="date"
          id="countDate"
        >

        <div class="helper-text">
          請設定實際執行盤點的日期。
        </div>

      </div>


      <div class="form-group">

        <label for="isOpen">
          開放狀態
        </label>

        <select id="isOpen">

          <option value="false">
            未開放
          </option>

          <option value="true">
            開放
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="note">
          備註
        </label>

        <input
          type="text"
          id="note"
          placeholder="例如：11/1假日，改於11/2盤點"
        >

      </div>

    </div>


    <div class="button-group">

      <button
        type="button"
        id="saveButton"
        class="primary-button"
      >
        儲存盤點期間
      </button>

      <button
        type="button"
        id="cancelButton"
        class="secondary-button"
      >
        取消編輯
      </button>

    </div>


    <div id="status" class="status">
      請輸入盤點期間資料。
    </div>

  </section>


  <!-- 已設定期間 -->

  <section class="period-list">

    <h2 class="period-list-title">
      已設定的盤點期間
    </h2>

    <div id="periodList">
      正在讀取……
    </div>

  </section>


  <div class="back-area">

    <button
      type="button"
      class="back-button"
      id="backButton"
    >
      返回管理首頁
    </button>

  </div>

</main>


<!-- 通知收件者視窗 -->

<div
  class="modal-overlay"
  id="notificationModal"
>

  <div class="modal">

    <h2
      class="modal-title"
      id="notificationModalTitle"
    >
      寄送事前通知
    </h2>

    <p class="modal-description">
      請選擇本次通知的收件者。預設選取全部單位，確認後將開啟 SCU Webmail 撰寫郵件頁面。
      請先確認瀏覽器已登入您的職位信箱。
    </p>


    <div class="recipient-header">

      <label class="select-all-label">

        <input
          type="checkbox"
          id="selectAllRecipients"
          checked
        >

        全選

      </label>


      <span
        class="recipient-count"
        id="recipientCount"
      >
        已選取 0 個收件者
      </span>

    </div>


    <div
      class="recipient-list"
      id="recipientList"
    >
      正在讀取通知信箱……
    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="modal-cancel"
        id="notificationCancelButton"
      >
        取消
      </button>

      <button
        type="button"
        class="modal-confirm"
        id="notificationConfirmButton"
      >
        確認並開啟 Email
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://onebxqajsiqmhfcizaxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


const accessToken =
  localStorage.getItem(
    "admin_access_token"
  );


let editingId = null;


/* ===== 通知暫存資料 ===== */

let notificationPeriod =
  null;

let notificationRecipients =
  [];

/*
  通知類型：
  pre  = 事前通知
  day  = 盤點當日通知
*/

let notificationType =
  "pre";


/* ===== 登入檢查 ===== */

if (!accessToken) {

  window.location.href =
    "admin.html";

}


/* ===== 原有 DOM ===== */

const periodMonthInput =
  document.getElementById(
    "periodMonth"
  );

const countDateInput =
  document.getElementById(
    "countDate"
  );

const isOpenInput =
  document.getElementById(
    "isOpen"
  );

const noteInput =
  document.getElementById(
    "note"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const cancelButton =
  document.getElementById(
    "cancelButton"
  );

const statusBox =
  document.getElementById(
    "status"
  );

const periodList =
  document.getElementById(
    "periodList"
  );

const backButton =
  document.getElementById(
    "backButton"
  );


/* ===== 通知 DOM ===== */

const notificationModal =
  document.getElementById(
    "notificationModal"
  );

const notificationModalTitle =
  document.getElementById(
    "notificationModalTitle"
  );

const recipientList =
  document.getElementById(
    "recipientList"
  );

const recipientCount =
  document.getElementById(
    "recipientCount"
  );

const selectAllRecipients =
  document.getElementById(
    "selectAllRecipients"
  );

const notificationCancelButton =
  document.getElementById(
    "notificationCancelButton"
  );

const notificationConfirmButton =
  document.getElementById(
    "notificationConfirmButton"
  );


/* =========================================================
   讀取盤點期間
   ========================================================= */

async function loadPeriods() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods" +
        "?select=id,period_month,count_date,is_open,note" +
        "&order=period_month.asc",
        {
          method: "GET",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "讀取失敗：",
        errorText
      );

      periodList.textContent =
        "盤點期間資料讀取失敗。";

      return;
    }


    const periods =
      await response.json();


    periodList.innerHTML = "";


    if (periods.length === 0) {

      periodList.textContent =
        "目前尚未設定盤點期間。";

      return;
    }


    periods.forEach(
      function(period) {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "period-row";


        const periodInfo =
          document.createElement(
            "div"
          );

        periodInfo.className =
          "period-info";


        /* 盤點月份 */

        const monthItem =
          document.createElement(
            "div"
          );

        monthItem.className =
          "info-item";

        const monthLabel =
          document.createElement(
            "span"
          );

        monthLabel.className =
          "info-label";

        monthLabel.textContent =
          "盤點月份";

        const monthValue =
          document.createElement(
            "div"
          );

        monthValue.className =
          "info-value";

        monthValue.textContent =
          period.period_month;


        monthItem.appendChild(
          monthLabel
        );

        monthItem.appendChild(
          monthValue
        );


        /* 實際盤點日 */

        const dateItem =
          document.createElement(
            "div"
          );

        dateItem.className =
          "info-item";

        const dateLabel =
          document.createElement(
            "span"
          );

        dateLabel.className =
          "info-label";

        dateLabel.textContent =
          "實際盤點日";

        const dateValue =
          document.createElement(
            "div"
          );

        dateValue.className =
          "info-value";

        dateValue.textContent =
          period.count_date;


        dateItem.appendChild(
          dateLabel
        );

        dateItem.appendChild(
          dateValue
        );


        /* 狀態 */

        const statusItem =
          document.createElement(
            "div"
          );

        statusItem.className =
          "info-item";

        const statusLabel =
          document.createElement(
            "span"
          );

        statusLabel.className =
          "info-label";

        statusLabel.textContent =
          "開放狀態";

        const statusBadge =
          document.createElement(
            "span"
          );

        statusBadge.textContent =
          period.is_open
            ? "開放"
            : "未開放";

        statusBadge.className =
          "status-badge " +
          (
            period.is_open
              ? "open"
              : "closed"
          );


        statusItem.appendChild(
          statusLabel
        );

        statusItem.appendChild(
          statusBadge
        );


        /* 備註 */

        const noteItem =
          document.createElement(
            "div"
          );

        noteItem.className =
          "info-item";

        const noteLabel =
          document.createElement(
            "span"
          );

        noteLabel.className =
          "info-label";

        noteLabel.textContent =
          "備註";

        const noteValue =
          document.createElement(
            "div"
          );

        noteValue.className =
          "info-value";

        noteValue.textContent =
          period.note || "－";


        noteItem.appendChild(
          noteLabel
        );

        noteItem.appendChild(
          noteValue
        );


        periodInfo.appendChild(
          monthItem
        );

        periodInfo.appendChild(
          dateItem
        );

        periodInfo.appendChild(
          statusItem
        );

        periodInfo.appendChild(
          noteItem
        );


        /* 操作按鈕 */

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "period-actions";


        const editButton =
          document.createElement(
            "button"
          );

        editButton.type =
          "button";

        editButton.className =
          "edit-button";

        editButton.textContent =
          "編輯";


        editButton.addEventListener(
          "click",
          function() {

            startEdit(period);

          }
        );


        const deleteButton =
          document.createElement(
            "button"
          );

        deleteButton.type =
          "button";

        deleteButton.className =
          "delete-button";

        deleteButton.textContent =
          "刪除此設定";


        deleteButton.addEventListener(
          "click",
          function() {

            deletePeriod(
              period.id
            );

          }
        );


        /* 寄送事前通知 */

        const notifyButton =
          document.createElement(
            "button"
          );

        notifyButton.type =
          "button";

        notifyButton.className =
          "notify-button";

        notifyButton.textContent =
          "寄送事前通知";


        notifyButton.addEventListener(
          "click",
          function() {

            openNotificationModal(
              period,
              "pre"
            );

          }
        );


        /* 盤點當日通知 */

        const dayNotifyButton =
          document.createElement(
            "button"
          );

        dayNotifyButton.type =
          "button";

        dayNotifyButton.className =
          "notify-button";

        dayNotifyButton.textContent =
          "盤點當日通知";


        dayNotifyButton.addEventListener(
          "click",
          function() {

            openNotificationModal(
              period,
              "day"
            );

          }
        );


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );

        actions.appendChild(
          notifyButton
        );

        actions.appendChild(
          dayNotifyButton
        );


        row.appendChild(
          periodInfo
        );

        row.appendChild(
          actions
        );


        periodList.appendChild(
          row
        );

      }
    );


  } catch (error) {

    console.error(error);

    periodList.textContent =
      "系統連線失敗，請稍後再試。";

  }

}


/* =========================================================
   編輯
   ========================================================= */

function startEdit(period) {

  editingId =
    period.id;


  periodMonthInput.value =
    period.period_month.substring(
      0,
      7
    );

  periodMonthInput.disabled =
    true;


  countDateInput.value =
    period.count_date;

  isOpenInput.value =
    period.is_open
      ? "true"
      : "false";

  noteInput.value =
    period.note || "";


  saveButton.textContent =
    "儲存修改";

  cancelButton.style.display =
    "block";


  statusBox.textContent =
    "目前正在編輯盤點期間。";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   儲存
   ========================================================= */

async function savePeriod() {

  const periodMonth =
    periodMonthInput.value;

  const countDate =
    countDateInput.value;

  const isOpen =
    isOpenInput.value ===
    "true";

  const note =
    noteInput.value.trim();


  if (!periodMonth) {

    statusBox.textContent =
      "請選擇盤點月份。";

    return;
  }


  if (!countDate) {

    statusBox.textContent =
      "請設定實際盤點日。";

    return;
  }


  if (editingId !== null) {

    await updatePeriod(
      editingId,
      countDate,
      isOpen,
      note
    );

    return;
  }


  const data = {

    period_month:
      periodMonth + "-01",

    count_date:
      countDate,

    is_open:
      isOpen,

    note:
      note || null

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods",
        {
          method: "POST",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              data
            )
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "新增失敗：",
        errorText
      );

      statusBox.textContent =
        "新增失敗：" +
        errorText;

      return;
    }


    statusBox.textContent =
      "盤點期間已成功儲存。";


    clearForm();

    await loadPeriods();


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "系統連線失敗，請稍後再試。";

  }

}


/* =========================================================
   修改
   ========================================================= */

async function updatePeriod(
  id,
  countDate,
  isOpen,
  note
) {

  const data = {

    count_date:
      countDate,

    is_open:
      isOpen,

    note:
      note || null

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              data
            )
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "修改失敗：",
        errorText
      );

      statusBox.textContent =
        "修改失敗：" +
        errorText;

      return;
    }


    statusBox.textContent =
      "盤點期間已成功修改。";


    clearForm();

    await loadPeriods();


  } catch (error) {

    console.error(error);

    statusBox.textContent =
      "系統連線失敗，請稍後再試。";

  }

}


/* =========================================================
   取消編輯
   ========================================================= */

function cancelEdit() {

  clearForm();

  statusBox.textContent =
    "已取消編輯。";

}


function clearForm() {

  editingId =
    null;


  periodMonthInput.value =
    "";

  periodMonthInput.disabled =
    false;


  countDateInput.value =
    "";

  isOpenInput.value =
    "false";

  noteInput.value =
    "";


  saveButton.textContent =
    "儲存盤點期間";

  cancelButton.style.display =
    "none";

}


/* =========================================================
   刪除
   ========================================================= */

async function deletePeriod(id) {

  const confirmed =
    confirm(
      "確定要刪除這筆盤點期間設定嗎？"
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/inventory_periods?id=eq." +
        id,
        {
          method: "DELETE",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "刪除失敗：",
        errorText
      );

      alert(
        "刪除失敗，請通知總務課處理。"
      );

      return;
    }


    alert(
      "盤點期間已刪除。"
    );


    await loadPeriods();


  } catch (error) {

    console.error(error);

    alert(
      "系統連線失敗，請稍後再試。"
    );

  }

}


/* =========================================================
   讀取 17 個通知信箱
   ========================================================= */

async function loadNotificationEmails() {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/unit_notification_emails" +
      "?select=id,unit_id,email,is_active,units(name)" +
      "&is_active=eq.true" +
      "&order=unit_id.asc",
      {
        method: "GET",

        headers: {
          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken
        }
      }
    );


  if (!response.ok) {

    const errorText =
      await response.text();

    console.error(
      "通知信箱讀取失敗：",
      errorText
    );

    throw new Error(
      "通知信箱資料讀取失敗。"
    );

  }


  return await response.json();

}


/* =========================================================
   開啟通知視窗
   ========================================================= */

async function openNotificationModal(
  period,
  type = "pre"
) {

  notificationPeriod =
    period;

  notificationType =
    type;

  notificationRecipients =
    [];


  if (
    notificationType ===
    "day"
  ) {

    notificationModalTitle.textContent =
      "寄送 " +
      formatPeriodMonth(
        period.period_month
      ) +
      " 盤點當日通知";

  } else {

    notificationModalTitle.textContent =
      "寄送 " +
      formatPeriodMonth(
        period.period_month
      ) +
      " 事前通知";

  }


  recipientList.innerHTML =
    "正在讀取通知信箱……";


  recipientCount.textContent =
    "已選取 0 個收件者";


  selectAllRecipients.checked =
    true;


  notificationModal.classList.add(
    "show"
  );


  try {

    const rows =
      await loadNotificationEmails();


    notificationRecipients =
      rows;


    renderRecipients();


  } catch (error) {

    console.error(error);

    recipientList.textContent =
      "通知信箱讀取失敗，請確認資料庫設定。";

  }

}


/* =========================================================
   顯示收件者
   ========================================================= */

function renderRecipients() {

  recipientList.innerHTML =
    "";


  if (
    notificationRecipients.length ===
    0
  ) {

    recipientList.textContent =
      "目前沒有可用的通知信箱。";

    updateRecipientCount();

    return;

  }


  notificationRecipients.forEach(
    function(recipient) {

      const label =
        document.createElement(
          "label"
        );

      label.className =
        "recipient-item";


      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      checkbox.className =
        "recipient-checkbox";

      checkbox.checked =
        true;

      checkbox.dataset.id =
        recipient.id;


      checkbox.addEventListener(
        "change",
        function() {

          updateSelectAllState();

          updateRecipientCount();

        }
      );


      const text =
        document.createElement(
          "span"
        );

      text.className =
        "recipient-text";


      const unit =
        document.createElement(
          "span"
        );

      unit.className =
        "recipient-unit";

      unit.textContent =
        getUnitName(
          recipient
        );


      const email =
        document.createElement(
          "span"
        );

      email.className =
        "recipient-email";

      email.textContent =
        recipient.email;


      text.appendChild(
        unit
      );

      text.appendChild(
        email
      );


      label.appendChild(
        checkbox
      );

      label.appendChild(
        text
      );


      recipientList.appendChild(
        label
      );

    }
  );


  updateRecipientCount();

}


/* =========================================================
   取得單位名稱
   ========================================================= */

function getUnitName(
  recipient
) {

  if (
    recipient.units &&
    recipient.units.name
  ) {

    return recipient.units.name;

  }


  const unitNames = {

    1: "總務課",
    2: "營業部",
    3: "水碓分社",
    4: "竹圍分社",
    5: "英專分社",
    6: "義山分社",
    7: "三芝分社",
    8: "八里分社",
    9: "成州分社",
    10: "五股分社",
    11: "萬金分社",
    12: "新莊分社",
    13: "泰山分社",
    14: "林口分社",
    15: "板橋分社",
    16: "蘆洲分社",
    17: "三重分社"

  };


  return (
    unitNames[
      recipient.unit_id
    ] ||
    "未命名單位"
  );

}


/* =========================================================
   格式化月份
   ========================================================= */

function formatPeriodMonth(
  value
) {

  if (!value) {
    return "";
  }


  const text =
    String(value).substring(
      0,
      7
    );


  const parts =
    text.split("-");


  if (
    parts.length !== 2
  ) {

    return text;

  }


  return (
    parts[0] +
    "年" +
    Number(parts[1]) +
    "月"
  );

}


/* =========================================================
   全選
   ========================================================= */

selectAllRecipients.addEventListener(
  "change",
  function() {

    const checkboxes =
      document.querySelectorAll(
        ".recipient-checkbox"
      );


    checkboxes.forEach(
      function(checkbox) {

        checkbox.checked =
          selectAllRecipients.checked;

      }
    );


    updateRecipientCount();

  }
);


/* =========================================================
   更新全選狀態
   ========================================================= */

function updateSelectAllState() {

  const checkboxes =
    Array.from(
      document.querySelectorAll(
        ".recipient-checkbox"
      )
    );


  if (
    checkboxes.length ===
    0
  ) {

    selectAllRecipients.checked =
      false;

    selectAllRecipients.indeterminate =
      false;

    return;

  }


  const checkedCount =
    checkboxes.filter(
      checkbox =>
        checkbox.checked
    ).length;


  selectAllRecipients.checked =
    checkedCount ===
    checkboxes.length;


  selectAllRecipients.indeterminate =
    checkedCount > 0 &&
    checkedCount <
      checkboxes.length;

}


/* =========================================================
   更新收件者數量
   ========================================================= */

function updateRecipientCount() {

  const checkedCount =
    document.querySelectorAll(
      ".recipient-checkbox:checked"
    ).length;


  recipientCount.textContent =
    "已選取 " +
    checkedCount +
    " 個收件者";

}


/* =========================================================
   關閉通知視窗
   ========================================================= */

function closeNotificationModal() {

  notificationModal.classList.remove(
    "show"
  );

  notificationPeriod =
    null;

  notificationRecipients =
    [];

  notificationType =
    "pre";

}


/* =========================================================
   建立 SCU Webmail 郵件草稿
   ========================================================= */

function openEmailDraft() {

  if (!notificationPeriod) {

    return;

  }


  const selectedCheckboxes =
    Array.from(
      document.querySelectorAll(
        ".recipient-checkbox:checked"
      )
    );


  if (
    selectedCheckboxes.length ===
    0
  ) {

    alert(
      "請至少選擇一個收件者。"
    );

    return;

  }


  const selectedIds =
    selectedCheckboxes.map(
      checkbox =>
        Number(
          checkbox.dataset.id
        )
    );


  const selectedRecipients =
    notificationRecipients.filter(
      recipient =>
        selectedIds.includes(
          Number(
            recipient.id
          )
        )
    );


  const emails =
    selectedRecipients
      .map(
        recipient =>
          recipient.email
      )
      .filter(
        email =>
          email
      );


  if (
    emails.length ===
    0
  ) {

    alert(
      "目前沒有有效的收件者 Email。"
    );

    return;

  }


  const periodText =
    formatPeriodMonth(
      notificationPeriod.period_month
    );


  const countDate =
    notificationPeriod.count_date;


  let subject =
    "";

  let body =
    "";


  /* =====================================================
     事前通知
     保留原本已確認的通知內容
     ===================================================== */

  if (
    notificationType ===
    "pre"
  ) {

    subject =
      "庫存盤點事前通知－" +
      periodText;


    body =
      "各營業單位您好：\n\n" +

      "本社 " +
      periodText +
      "庫存盤點日期為 " +
      countDate +
      "。\n\n" +

      "建議貴單位於盤點當日 16:30 後登入庫存盤點系統完成庫存盤點填報；系統於盤點開放日即可進行填報。\n\n" +

      "庫存盤點系統：\n" +
      window.location.origin +
      "/inventory-system/\n\n" +

      "請依系統畫面填報各項耗材庫存數量，完成後送出即可。\n\n" +

      "如有盤點作業相關問題，請洽總務課。\n\n" +

      "淡水信用合作社\n" +
      "總務課";

  }


  /* =====================================================
     盤點當日通知
     ===================================================== */

  if (
    notificationType ===
    "day"
  ) {

    subject =
      "庫存盤點當日通知－" +
      periodText;


    body =
      "各營業單位您好：\n\n" +

      "本社 " +
      periodText +
      "庫存盤點日期為今日（" +
      countDate +
      "）。\n\n" +

      "請貴單位於今日完成庫存盤點填報，建議於今日 16:30 後登入庫存盤點系統進行盤點。\n\n" +

      "庫存盤點系統：\n" +
      window.location.origin +
      "/inventory-system/\n\n" +

      "請依系統畫面填報各項耗材庫存數量，完成後送出即可。\n\n" +

      "如有盤點作業相關問題，請洽總務課。\n\n" +

      "淡水信用合作社\n" +
      "總務課";

  }


  /*
    SCU Webmail 撰寫郵件頁面
    必須先登入 Webmail。
  */

  const composeUrl =
    "https://mail.scu.org.tw/" +
    "?_task=mail" +
    "&_action=compose" +
    "&to=" +
    encodeURIComponent(
      emails.join(",")
    ) +
    "&subject=" +
    encodeURIComponent(
      subject
    ) +
    "&body=" +
    encodeURIComponent(
      body
    );


  /*
    開啟新的 Webmail 分頁，
    保留目前庫存系統頁面。
  */

  window.open(
    composeUrl,
    "_blank"
  );

}


/* =========================================================
   通知按鈕
   ========================================================= */

notificationConfirmButton.addEventListener(
  "click",
  function() {

    const selectedCount =
      document.querySelectorAll(
        ".recipient-checkbox:checked"
      ).length;


    if (
      selectedCount ===
      0
    ) {

      alert(
        "請至少選擇一個收件者。"

   取消通知

notificationCancelButton.addEventListener(

notificationModal.addEventListener(

saveButton.addEventListener(

);


cancelButton.addEventListener(
  "click",

);


backButton.addEventListener(

);
