<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廠商進貨登錄｜庫存盤點系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f6f3;
      color: #26332c;
    }

    /* ===== Header ===== */

    .page-header {
      background: #14532d;
      color: white;
      padding: 22px 24px;
      box-shadow: 0 2px 8px rgba(20, 83, 45, 0.12);
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .system-name {
      font-size: 14px;
      letter-spacing: 0.08em;
      opacity: 0.88;
      margin-bottom: 5px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ===== Main ===== */

    .container {
      max-width: 700px;
      margin: 38px auto 60px;
      padding: 0 24px;
    }

    .page-intro {
      margin-bottom: 24px;
    }

    .page-intro h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #174c2d;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 0;
      color: #6d7971;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ===== Card ===== */

    .card {
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(31, 55, 40, 0.05);
    }

    .card-title {
      margin: 0 0 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e4ebe6;
      font-size: 18px;
      font-weight: 600;
      color: #245337;
    }

    /* ===== Form ===== */

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #34443a;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px 13px;
      font-family: inherit;
      font-size: 15px;
      color: #26332c;
      background: #ffffff;
      border: 1px solid #cfd9d2;
      border-radius: 8px;
      outline: none;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #57916c;
      box-shadow: 0 0 0 3px rgba(87, 145, 108, 0.12);
    }

    input::placeholder,
    textarea::placeholder {
      color: #a1aaa4;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    .helper-text {
      margin-top: 6px;
      font-size: 12px;
      color: #818b84;
      line-height: 1.5;
    }

    /* ===== Buttons ===== */

    .primary-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #17613a;
      color: white;
      transition:
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .primary-button:hover {
      background: #124f2f;
      box-shadow: 0 3px 8px rgba(23, 97, 58, 0.18);
    }

    .back-button {
      width: 100%;
      margin-top: 12px;
      padding: 13px 18px;
      font-family: inherit;
      font-size: 15px;
      border: 1px solid #c6d0c9;
      border-radius: 8px;
      cursor: pointer;
      background: #ffffff;
      color: #536159;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .back-button:hover {
      background: #f5f7f5;
      border-color: #aebbb2;
    }

    /* ===== Notice ===== */

    .notice {
      margin-top: 22px;
      padding: 12px 14px;
      background: #edf5ef;
      border: 1px solid #d8e8dc;
      border-radius: 8px;
      color: #5f7065;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ===== Mobile ===== */

    @media (max-width: 600px) {

      .page-header {
        padding: 18px 20px;
      }

      .header-title {
        font-size: 20px;
      }

      .container {
        margin-top: 28px;
        padding: 0 16px;
      }

      .page-intro h1 {
        font-size: 23px;
      }

      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>

<header class="page-header">

  <div class="header-inner">

    <div class="system-name">
      淡水信用合作社
    </div>

    <div class="header-title">
      庫存盤點系統
    </div>

  </div>

</header>


<main class="container">

  <div class="page-intro">

    <h1>
      廠商進貨登錄
    </h1>

    <p class="subtitle">
      登錄廠商進貨之耗材資料，作為庫存統計之進貨依據。
    </p>

  </div>


  <section class="card">

    <h2 class="card-title">
      進貨資料
    </h2>


    <!-- 進貨日期 -->

    <div class="form-group">

      <label for="date">
        進貨日期
      </label>

      <input
        type="date"
        id="date"
      >

    </div>


    <!-- 耗材項目 -->

    <div class="form-group">

      <label for="item">
        耗材項目
      </label>

      <select id="item">

        <option value="">
          請選擇耗材
        </option>

        <option value="1">
          櫃員機色帶(長)
        </option>

        <option value="2">
          報表機色帶(小)
        </option>

        <option value="3">
          ATM色帶(長)
        </option>

        <option value="4">
          ATM色帶(小)
        </option>

        <option value="5">
          ATM紙捲(餘額證明)
        </option>

        <option value="6">
          ATM紙捲(敘時)
        </option>

      </select>

    </div>


    <!-- 進貨數量 -->

    <div class="form-group">

      <label for="quantity">
        進貨數量
      </label>

      <input
        type="number"
        id="quantity"
        min="1"
        placeholder="請輸入進貨數量"
      >

      <div class="helper-text">
        請輸入本次實際進貨數量。
      </div>

    </div>


    <!-- 備註 -->

    <div class="form-group">

      <label for="note">
        備註
      </label>

      <textarea
        id="note"
        placeholder="可填寫廠商、採購單號或其他備註"
      ></textarea>

    </div>


    <!-- 送出 -->

    <button
      type="button"
      class="primary-button"
      onclick="submitPurchase()"
    >
      送出進貨資料
    </button>


    <!-- 返回 -->

    <button
      type="button"
      class="back-button"
      onclick="location.href='admin-home.html'"
    >
      返回管理首頁
    </button>


    <div class="notice">
      請確認進貨日期、耗材項目及數量無誤後，再送出進貨資料。
    </div>

  </section>

</main>


<script>

// 檢查是否已登入
const accessToken =
  localStorage.getItem(
    "admin_access_token"
  );


if (!accessToken) {

  window.location.href =
    "admin.html";

}


const SUPABASE_URL =
  "https://onebxqajsiqmhfcizaxl.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


// 預設今天
document.getElementById(
  "date"
).value =
  new Date()
    .toISOString()
    .split("T")[0];


async function submitPurchase() {

  const date =
    document
      .getElementById("date")
      .value;


  const itemId =
    document
      .getElementById("item")
      .value;


  const quantity =
    document
      .getElementById("quantity")
      .value;


  const note =
    document
      .getElementById("note")
      .value
      .trim();


  if (!date) {

    alert(
      "請選擇進貨日期"
    );

    return;
  }


  if (!itemId) {

    alert(
      "請選擇耗材項目"
    );

    return;
  }


  if (
    !quantity ||
    Number(quantity) <= 0
  ) {

    alert(
      "請輸入正確的進貨數量"
    );

    return;
  }


  const data = {

    purchase_date:
      date,

    item_id:
      Number(itemId),

    quantity:
      Number(quantity),

    note:
      note || null

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/purchases",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              data
            )

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        errorText
      );

      alert(
        "進貨資料送出失敗：" +
        errorText
      );

      return;
    }


    alert(
      "進貨資料已成功登錄！"
    );


    document.getElementById(
      "item"
    ).value = "";


    document.getElementById(
      "quantity"
    ).value = "";


    document.getElementById(
      "note"
    ).value = "";


  } catch (error) {

    console.error(
      error
    );

    alert(
      "系統連線失敗，請稍後再試。"
    );

  }

}

</script>

</body>
</html>
