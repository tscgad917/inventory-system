<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社員及貴賓活動報名統計｜管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#3f4b3b;font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;line-height:1.6}header{background:#44633f;color:#fff;padding:20px}header>div,main{max-width:1100px;margin:auto}h1{font-size:22px;margin:0}main{padding:22px 16px 40px}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:8px;background:#44633f;color:white;padding:10px 14px;font:inherit;cursor:pointer}.tabs button.secondary,.btn.secondary{background:#e6eee5;color:#355334}.panel{background:#fff;border:1px solid #dfe7dc;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 4px 14px #26332c0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd7cb;border-radius:8px;font:inherit;background:white}textarea{min-height:76px}form .field{margin-bottom:12px}.muted{color:#718071;font-size:13px}.msg{padding:11px;border-radius:8px;background:#edf5ef;margin:10px 0;white-space:pre-wrap}.error{background:#fff0ef;color:#9f2e25}.hidden{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:650px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7ece5;vertical-align:top}th{background:#f3f7f1}.tag{display:inline-block;background:#edf5ef;color:#355334;border-radius:999px;padding:2px 8px;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px}.btn.danger{background:#a8322a;color:#fff}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#f3f7f1;border-radius:10px;padding:12px}.stat strong{display:block;font-size:24px;color:#355334}.qr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.qr canvas,.qr img{max-width:190px}a{color:#245c39}@media(max-width:600px){main{padding:16px 10px}.panel{padding:14px}}
</style>
</head>
<body>
<header><div><div style="font-size:13px;opacity:.85">淡水信用合作社｜總務課</div><h1>社員及貴賓活動報名統計</h1></div></header>
<main>
<div class="bar"><div class="muted" id="adminState">正在確認管理員身分……</div><div class="actions"><a href="admin-center.html">返回統一管理中心</a><button class="btn secondary" id="logout">登出</button></div></div>
<div id="fatal" class="msg error hidden"></div>
<div id="app" class="hidden">
<div class="tabs"><button data-tab="batches">活動批次</button><button data-tab="people" class="secondary">人物名冊</button><button data-tab="registrations" class="secondary">報名紀錄與統計</button></div>
<section id="tab-batches" class="panel">
<h2>建立活動批次</h2><p class="muted">建立後可設定開放狀態；只有狀態為「開放填寫」且目前時間落在填寫期間內，前台才能提交。</p>
<form id="batchForm">
<div class="grid">
<div class="field"><label for="batchName">活動名稱</label><input id="batchName" required maxlength="150" placeholder="例如：理監事聯席會議餐敘"></div>
<div class="field"><label for="location">活動地點</label><input id="location" required maxlength="250" placeholder="請輸入活動地點"></div>
<div class="field"><label for="activityStart">活動開始時間</label><input id="activityStart" type="datetime-local" required></div>
<div class="field"><label for="activityEnd">活動結束時間（選填）</label><input id="activityEnd" type="datetime-local"></div>
<div class="field"><label for="formStart">開放填寫時間</label><input id="formStart" type="datetime-local" required></div>
<div class="field"><label for="formEnd">填寫截止時間</label><input id="formEnd" type="datetime-local" required></div>
</div>
<div class="field"><label>本場活動開放參與身分（可複選）</label><div class="grid" id="batchIdentityOptions" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="director" checked style="width:auto"> 理事</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="supervisor" checked style="width:auto"> 監事</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="advisor" checked style="width:auto"> 顧問</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="representative" checked style="width:auto"> 社員代表</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="staff" checked style="width:auto"> 職員</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="spouse" checked style="width:auto"> 理監事及顧問配偶</label>
<label style="font-weight:400"><input type="checkbox" name="batchIdentity" value="guest" checked style="width:auto"> 貴賓</label>
</div><p class="muted">僅勾選本場活動允許參與的身分；未勾選的身分不應列入本場報名對象。</p></div>
<div class="field"><label for="description">活動說明（選填）</label><textarea id="description" maxlength="1000"></textarea></div>
<button class="btn" type="submit">建立活動</button>
</form><div id="batchMsg" class="msg hidden"></div>
<h2 style="margin-top:24px">活動清單</h2><div id="batches" class="table-wrap">載入中……</div>
</section>
<section id="tab-people" class="panel hidden">
<h2>人物名冊維護</h2><p class="muted">停用人物不會刪除歷史報名資料。名冊姓名應避免重複；同名者將交由管理人員確認。</p>
<form id="personForm">
<input id="personId" type="hidden">
<div class="grid">
<div class="field"><label for="fullName">姓名</label><input id="fullName" required maxlength="100"></div>
<div class="field"><label for="personType">身分別</label><select id="personType" required><option value="director">理事</option><option value="supervisor">監事</option><option value="advisor">顧問</option><option value="representative">社員代表</option><option value="staff">職員</option><option value="spouse">理監事及顧問配偶</option><option value="guest">貴賓</option></select></div>
<div class="field"><label for="title">職稱</label><input id="title" maxlength="100" placeholder="例如：理事長"></div>
<div class="field"><label for="phone">聯絡電話</label><input id="phone" maxlength="50"></div>
</div><div class="field"><label for="personNotes">備註</label><input id="personNotes" maxlength="500"></div>
<div class="actions"><button class="btn" type="submit">儲存名冊</button><button class="btn secondary" type="button" id="cancelPerson">清除表單</button></div>
</form><div id="personMsg" class="msg hidden"></div><div class="field"><label for="peopleTypeFilter">快速查詢身分</label><select id="peopleTypeFilter"><option value="all">全部身分</option><option value="director">理事</option><option value="supervisor">監事</option><option value="advisor">顧問</option><option value="representative">社員代表</option><option value="staff">職員</option><option value="spouse">理監事及顧問配偶</option><option value="guest">貴賓</option></select></div><div id="peopleCount" class="msg">名冊共 0 人</div><div id="people" class="table-wrap">載入中……</div><div id="personConfirmModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="personConfirmTitle" style="position:fixed;inset:0;z-index:9999;background:#17231788;align-items:center;justify-content:center;padding:18px">
<div style="width:min(560px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px #0003">
<h2 id="personConfirmTitle" style="margin-top:0">確認儲存名冊變更</h2><p class="muted">請再次確認以下變更內容。按「確認儲存」後才會更新資料庫。</p>
<div id="personConfirmChanges" style="white-space:pre-wrap;line-height:1.9;padding:12px;background:#f3f7f1;border-radius:8px;margin-bottom:16px"></div>
<div class="actions" style="justify-content:flex-end"><button class="btn secondary" type="button" id="cancelPersonConfirm">取消</button><button class="btn" type="button" id="confirmPersonSave">確認儲存</button></div>
</div></div>
</section>
<section id="tab-registrations" class="panel hidden">
<h2>報名紀錄與統計</h2><div class="field"><label for="registrationBatch">選擇活動</label><select id="registrationBatch"><option value="">請選擇活動</option></select></div>
<div id="stats" class="stats"></div><div class="actions" style="margin:12px 0"><button class="btn" id="exportCsv" type="button">匯出 CSV</button><button class="btn secondary" id="refreshRegs" type="button">重新載入</button></div>
<div id="registrations" class="table-wrap">請先選擇活動。</div>
</section>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const SUPABASE_KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
let ALLOWED="";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let batches=[],people=[],registrations=[];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showMsg(id,text,error){const el=$(id);el.textContent=text;el.classList.remove("hidden","error");if(error)el.classList.add("error");}
function hideMsg(id){$(id).classList.add("hidden");}
function dateLocal(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString("zh-TW",{hour12:false});}
function localISO(id){const v=$(id).value;return v?new Date(v).toISOString():null;}
async function init(){
 // 導覽限制：首次進入需由統一管理中心點選；同一分頁重新整理可繼續使用。
 // 這是前端導覽限制，不取代 Supabase 的身分驗證與 RLS 權限。
 const nav=performance.getEntriesByType("navigation")[0];
 const isReload=nav&&nav.type==="reload";
 const fromCenter=sessionStorage.getItem("eventAdminEntryTicket")==="from-center";
 sessionStorage.removeItem("eventAdminEntryTicket");
 if(!fromCenter&&!(isReload&&sessionStorage.getItem("eventAdminTabAuthorized")==="yes")){
  document.body.innerHTML='<main style="max-width:680px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;line-height:1.8;color:#26332c"><h2>請由統一管理中心進入</h2><p>為避免直接開啟後台連結，請先返回統一管理中心，再由管理中心選擇對應的管理功能。</p></main>';
  return;
 }
 sessionStorage.setItem("eventAdminTabAuthorized","yes");
 try{
  let r=await db.auth.getSession();if(r.error)throw r.error;let session=r.data.session;
  if(!session){const access=localStorage.getItem("admin_access_token"),refresh=localStorage.getItem("admin_refresh_token"),email=(localStorage.getItem("admin_email")||"").toLowerCase();if(!access||!refresh||!email)throw new Error("找不到有效登入狀態，請從統一管理中心重新登入。");r=await db.auth.setSession({access_token:access,refresh_token:refresh});if(r.error)throw r.error;session=r.data.session;}
  if(!session)throw new Error("未取得有效登入狀態。");
  const u=await db.auth.getUser();if(u.error)throw u.error;if(u.data.user.user_metadata&&u.data.user.user_metadata.must_change_password===true){window.location.replace("https://tscgad917.github.io/inventory-system/force-change-password.html");return;}const actualEmail=(u.data.user.email||"").toLowerCase();const auth=await db.from("admin_authorizations").select("email,role,is_active").eq("email",actualEmail).eq("is_active",true).maybeSingle();if(auth.error)throw auth.error;if(!auth.data)throw new Error("此帳號未獲授權或管理權限已停用。");ALLOWED=actualEmail;
  localStorage.setItem("admin_access_token",session.access_token);localStorage.setItem("admin_refresh_token",session.refresh_token);localStorage.setItem("admin_email",actualEmail);localStorage.setItem("admin_role",auth.data.role);
  $("adminState").textContent="管理員已驗證："+ALLOWED;$("app").classList.remove("hidden");
  await Promise.all([loadBatches(),loadPeople()]);
 }catch(e){$("adminState").textContent="驗證失敗";$("fatal").textContent=(e&&e.message)||String(e);$("fatal").classList.remove("hidden");}
}
async function loadBatches(){
 const r=await db.from("event_batches").select("*").order("activity_start",{ascending:false});if(r.error)throw r.error;batches=r.data||[];
 $("batches").innerHTML=batches.length?'<table><thead><tr><th>活動</th><th>活動時間／地點</th><th>填寫期間</th><th>狀態</th><th>前台連結／操作</th></tr></thead><tbody>'+batches.map(b=>'<tr><td><strong>'+esc(b.batch_name)+'</strong><br><small>ID '+b.id+'</small><br><small>參與身分：'+esc((b.allowed_person_types||["director","supervisor","advisor","representative","staff","spouse","guest"]).map(t=>PERSON_TYPES[t]||t).join("、"))+'</small></td><td>'+esc(dateLocal(b.activity_start))+'<br>'+esc(b.location)+'</td><td>'+esc(dateLocal(b.form_start))+'<br>至 '+esc(dateLocal(b.form_end))+'</td><td><select data-status="'+b.id+'">'+[['draft','草稿'],['scheduled','尚未開放'],['open','開放填寫'],['closed','停止填寫'],['completed','已完成']].map(x=>'<option value="'+x[0]+'" '+(b.status===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></td><td><div class="actions"><button class="btn" data-save-status="'+b.id+'">更新狀態</button><button class="btn secondary" data-show-qr="'+b.id+'">報名連結／QR</button></div><div id="qr-'+b.id+'"></div></td></tr>').join("")+'</tbody></table>':'目前尚無活動。';
 $("registrationBatch").innerHTML='<option value="">請選擇活動</option>'+batches.map(b=>'<option value="'+b.id+'">'+esc(b.batch_name)+'（'+esc(b.status)+'）</option>').join("");
 $("batches").querySelectorAll("[data-save-status]").forEach(btn=>btn.addEventListener("click",async()=>{const id=Number(btn.dataset.saveStatus),status=$("batches").querySelector('[data-status="'+id+'"]').value;const r=await db.from("event_batches").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error){alert("更新失敗："+r.error.message);return;}await loadBatches();alert("活動狀態已更新。");}));
 $("batches").querySelectorAll("[data-show-qr]").forEach(btn=>btn.addEventListener("click",()=>showQr(Number(btn.dataset.showQr))));
}
function showQr(id){
 const b=batches.find(x=>x.id===id);if(!b)return;const url=location.origin+location.pathname.replace(/[^/]*$/,"")+"event-form.html?token="+encodeURIComponent(b.public_token);const el=$("qr-"+id);
 el.innerHTML='<div class="qr"><div><p><a href="'+esc(url)+'" target="_blank" rel="noopener">開啟報名頁</a></p><input readonly value="'+esc(url)+'" aria-label="報名網址"><button class="btn secondary" data-copy="'+esc(url)+'">複製網址</button><p class="muted">QR Code 載入後可直接列印或截取使用。</p></div><div id="qrimg-'+id+'"></div></div>';
 el.querySelector("[data-copy]").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(url);alert("已複製報名網址。");}catch(e){alert("請手動複製網址欄位。");}});
 const script=document.createElement("script");script.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";script.onload=()=>{if(window.QRCode)new QRCode($("qrimg-"+id),{text:url,width:180,height:180});};document.head.appendChild(script);
}
const PERSON_TYPES={director:"理事",supervisor:"監事",advisor:"顧問",representative:"社員代表",staff:"職員",spouse:"理監事及顧問配偶",guest:"貴賓"};
let originalPerson=null;
function renderPeople(){
 const selected=$("peopleTypeFilter").value;
 const filtered=selected==="all"?people:people.filter(p=>p.person_type===selected);
 $("peopleCount").textContent=(selected==="all"?"全部身分":PERSON_TYPES[selected])+"：共 "+filtered.length+" 人（名冊總數 "+people.length+" 人）";
 $("people").innerHTML=filtered.length?'<table><thead><tr><th>姓名</th><th>身分／職稱</th><th>電話</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+filtered.map(p=>'<tr><td>'+esc(p.full_name)+'</td><td>'+esc(PERSON_TYPES[p.person_type]||p.person_type)+'<br>'+esc(p.title)+'</td><td>'+esc(p.phone)+'</td><td>'+(p.is_active?'<span class="tag">啟用</span>':'<span class="tag">停用</span>')+'</td><td><div class="actions"><button class="btn secondary" data-edit-person="'+p.id+'">編輯</button><button class="btn" data-toggle-person="'+p.id+'">'+(p.is_active?'停用':'重新啟用')+'</button><button class="btn danger" data-delete-person="'+p.id+'">刪除</button></div></td></tr>').join("")+'</tbody></table>':'目前此身分沒有名冊資料。';
 $("people").querySelectorAll("[data-edit-person]").forEach(btn=>btn.addEventListener("click",()=>{const p=people.find(x=>x.id===Number(btn.dataset.editPerson));if(!p)return;originalPerson={...p};$("personId").value=p.id;$("fullName").value=p.full_name;$("personType").value=p.person_type;$("title").value=p.title||"";$("phone").value=p.phone||"";$("personNotes").value=p.notes||"";hideMsg("personMsg");window.scrollTo({top:0,behavior:"smooth"});}));
 $("people").querySelectorAll("[data-toggle-person]").forEach(btn=>btn.addEventListener("click",async()=>{const p=people.find(x=>x.id===Number(btn.dataset.togglePerson));if(!p)return;if(!confirm("確定要"+(p.is_active?"停用":"重新啟用")+"「"+p.full_name+"」？"))return;const r=await db.from("event_people").update({is_active:!p.is_active,updated_at:new Date().toISOString()}).eq("id",p.id);if(r.error){alert("更新失敗："+r.error.message);return;}await loadPeople();}));
 $("people").querySelectorAll("[data-delete-person]").forEach(btn=>btn.addEventListener("click",async()=>{const p=people.find(x=>x.id===Number(btn.dataset.deletePerson));if(!p)return;if(!confirm("確定要永久刪除名冊人物「"+p.full_name+"」？此操作無法復原。若已有報名紀錄關聯，系統會阻止刪除。"))return;btn.disabled=true;try{const check=await db.from("event_registrations").select("id").or("person_id.eq."+p.id+",spouse_of_person_id.eq."+p.id).limit(1);if(check.error){alert("無法確認是否已有報名紀錄，為避免誤刪，已取消刪除。\n"+check.error.message);return;}if((check.data||[]).length){alert("無法刪除「"+p.full_name+"」：此人物已與歷史報名紀錄關聯。為保留報名紀錄，請改用「停用」；停用後不影響既有資料。");return;}const del=await db.from("event_people").delete().eq("id",p.id).select("id");if(del.error){alert("刪除失敗："+del.error.message);return;}if(!del.data||!del.data.length){alert("未刪除任何資料，請重新整理後再試。");return;}if(String($("personId").value)===String(p.id)){$("personForm").reset();$("personId").value="";originalPerson=null;closePersonConfirm();}showMsg("personMsg","已永久刪除名冊人物「"+p.full_name+"」。");await loadPeople();}finally{btn.disabled=false;}}));
}
async function loadPeople(){
 const r=await db.from("event_people").select("*").order("is_active",{ascending:false}).order("full_name");if(r.error)throw r.error;people=r.data||[];renderPeople();
}
$("batchForm").addEventListener("submit",async e=>{e.preventDefault();hideMsg("batchMsg");const activity_start=localISO("activityStart"),activity_end=localISO("activityEnd"),form_start=localISO("formStart"),form_end=localISO("formEnd");if(new Date(form_end)<=new Date(form_start)){showMsg("batchMsg","填寫截止時間必須晚於開放時間。",true);return;}if(activity_end&&new Date(activity_end)<new Date(activity_start)){showMsg("batchMsg","活動結束時間不可早於開始時間。",true);return;}
 const allowed_person_types=Array.from(document.querySelectorAll('input[name="batchIdentity"]:checked')).map(x=>x.value);if(!allowed_person_types.length){showMsg("batchMsg","請至少勾選一種本場活動允許參與的身分。",true);return;}const payload={batch_name:$("batchName").value.trim(),location:$("location").value.trim(),activity_start,activity_end,form_start,form_end,description:$("description").value.trim()||null,allowed_person_types,status:"draft"};
 const r=await db.from("event_batches").insert(payload).select().single();if(r.error){showMsg("batchMsg","建立失敗："+r.error.message,true);return;}e.target.reset();showMsg("batchMsg","活動已建立，預設為草稿。請在活動清單更新為「開放填寫」後，前台才會受理報名。");await loadBatches();});
function currentPersonPayload(){return {full_name:$("fullName").value.trim(),person_type:$("personType").value,title:$("title").value.trim()||null,phone:$("phone").value.trim()||null,notes:$("personNotes").value.trim()||null,updated_at:new Date().toISOString()};}
function showPersonConfirm(payload){
 const labels={full_name:"姓名",person_type:"身分別",title:"職稱",phone:"聯絡電話",notes:"備註"};
 const changes=[];
 for(const key of ["full_name","person_type","title","phone","notes"]){
  const before=originalPerson?.[key]??null, after=payload[key]??null;
  if(String(before||"")!==String(after||""))changes.push(labels[key]+"：\n  原本："+(before||"（空白）")+"\n  修改為："+(after||"（空白）"));
 }
 $("personConfirmChanges").textContent=changes.length?changes.join("\n\n"):"資料內容沒有變更。";
 $("confirmPersonSave").disabled=!changes.length;
 $("confirmPersonSave").style.opacity=changes.length?"1":".5";
 $("personConfirmModal").classList.remove("hidden");$("personConfirmModal").style.display="flex";
}
function closePersonConfirm(){$("personConfirmModal").classList.add("hidden");$("personConfirmModal").style.display="none";}
async function savePersonChanges(){
 const id=$("personId").value,payload=currentPersonPayload();
 $("confirmPersonSave").disabled=true;
 let r;if(id)r=await db.from("event_people").update(payload).eq("id",Number(id));else r=await db.from("event_people").insert(payload);
 $("confirmPersonSave").disabled=false;
 if(r.error){closePersonConfirm();showMsg("personMsg","儲存失敗："+r.error.message,true);return;}
 closePersonConfirm();$("personForm").reset();$("personId").value="";originalPerson=null;showMsg("personMsg",id?"名冊變更已儲存。":"名冊已新增。");await loadPeople();
}
$("personForm").addEventListener("submit",async e=>{e.preventDefault();hideMsg("personMsg");const id=$("personId").value;if(id){showPersonConfirm(currentPersonPayload());return;}await savePersonChanges();});
$("confirmPersonSave").addEventListener("click",savePersonChanges);
$("cancelPersonConfirm").addEventListener("click",closePersonConfirm);
$("personConfirmModal").addEventListener("click",e=>{if(e.target===$("personConfirmModal"))closePersonConfirm();});
$("peopleTypeFilter").addEventListener("change",renderPeople);
$("cancelPerson").addEventListener("click",()=>{$("personForm").reset();$("personId").value="";originalPerson=null;hideMsg("personMsg");closePersonConfirm();});
document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",async()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("secondary",x!==btn));["batches","people","registrations"].forEach(t=>$("tab-"+t).classList.toggle("hidden",t!==btn.dataset.tab));if(btn.dataset.tab==="registrations")await loadRegistrations();}));
async function reviewIdentity(registrationId,kind){
 const select=$("registrations").querySelector('[data-review-select="'+registrationId+'"]');
 const personId=select?Number(select.value):0;
 if(!personId){alert("請先選擇名冊人物。");return;}
 const p=people.find(x=>x.id===personId);
 if(!p||!p.is_active){alert("請選擇啟用中的名冊人物。");return;}
 if(kind==="spouse"&&!["director","supervisor","advisor"].includes(p.person_type)){alert("配偶關係人只能選擇理事、監事或顧問。");return;}
 const current=registrations.find(x=>x.id===registrationId);if(!current)return;
 let payload;
 if(kind==="person"){
  payload={identity_status:"matched",person_id:p.id,spouse_of_person_id:null,person_name_snapshot:p.full_name,person_title_snapshot:p.title||null,spouse_name_snapshot:null,spouse_title_snapshot:null,reviewed_at:new Date().toISOString(),reviewed_by:ALLOWED,updated_at:new Date().toISOString()};
 }else{
  payload={identity_status:"spouse_matched",person_id:null,spouse_of_person_id:p.id,person_name_snapshot:null,person_title_snapshot:null,spouse_name_snapshot:p.full_name,spouse_title_snapshot:p.title||null,reviewed_at:new Date().toISOString(),reviewed_by:ALLOWED,updated_at:new Date().toISOString()};
 }
 const r=await db.from("event_registrations").update(payload).eq("id",registrationId);
 if(r.error){alert("確認失敗："+r.error.message);return;}
 alert("身分已更新。");await loadRegistrations();
}
async function loadRegistrations(){
 const id=$("registrationBatch").value;if(!id){$("stats").innerHTML="";$("registrations").textContent="請先選擇活動。";registrations=[];return;}
 const r=await db.from("event_registrations").select("*").eq("batch_id",Number(id)).order("created_at");if(r.error){$("registrations").textContent="載入失敗："+r.error.message;return;}registrations=r.data||[];
 const total=registrations.length,attend=registrations.filter(x=>x.attending).length,notAttend=total-attend,meal=registrations.filter(x=>x.meal_required===true).length,meat=registrations.filter(x=>x.diet_type==="meat").length,veg=registrations.filter(x=>x.diet_type==="vegetarian").length,pending=registrations.filter(x=>x.identity_status==="pending_review").length;
 $("stats").innerHTML=[["報名人數",total],["出席",attend],["不出席",notAttend],["需要餐食",meal],["葷食",meat],["素食",veg],["待確認身分",pending]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join("");
 const idLabel={matched:"名冊符合",spouse_matched:"配偶符合",pending_review:"待確認"};
 const activePeople=people.filter(p=>p.is_active);
 $("registrations").innerHTML=registrations.length?'<table><thead><tr><th>姓名</th><th>身分狀態</th><th>出席</th><th>餐食</th><th>職稱／關係</th><th>填寫時間</th><th>人工確認</th></tr></thead><tbody>'+registrations.map(x=>'<tr><td>'+esc(x.respondent_name)+'</td><td>'+esc(idLabel[x.identity_status]||x.identity_status)+'</td><td>'+(x.attending?'出席':'不出席')+'</td><td>'+(x.meal_required?(x.diet_type==="meat"?"葷食":"素食"):"不需要／未出席")+'</td><td>'+esc(x.person_title_snapshot||x.spouse_title_snapshot||"待確認")+(x.spouse_name_snapshot?"<br>關係人："+esc(x.spouse_name_snapshot):"")+'</td><td>'+esc(dateLocal(x.created_at))+'</td><td>'+(x.identity_status==="pending_review"?'<select data-review-select="'+x.id+'"><option value="">選擇名冊人物</option>'+activePeople.map(p=>'<option value="'+p.id+'">'+esc(p.full_name)+'（'+esc(p.title||p.person_type)+'）</option>').join("")+'</select><div class="actions" style="margin-top:6px"><button class="btn" data-review-person="'+x.id+'">確認本人</button><button class="btn secondary" data-review-spouse="'+x.id+'">確認配偶</button></div>':'—')+'</td></tr>').join("")+'</tbody></table>':'目前沒有報名紀錄。';
 $("registrations").querySelectorAll("[data-review-person]").forEach(btn=>btn.addEventListener("click",()=>reviewIdentity(Number(btn.dataset.reviewPerson),"person")));
 $("registrations").querySelectorAll("[data-review-spouse]").forEach(btn=>btn.addEventListener("click",()=>reviewIdentity(Number(btn.dataset.reviewSpouse),"spouse")));
}
$("registrationBatch").addEventListener("change",loadRegistrations);$("refreshRegs").addEventListener("click",loadRegistrations);
$("exportCsv").addEventListener("click",()=>{if(!registrations.length){alert("目前沒有可匯出的紀錄。");return;}const cols=[["respondent_name","姓名"],["identity_status","身分狀態"],["attending","是否出席"],["meal_required","是否需要餐食"],["diet_type","餐食種類"],["person_title_snapshot","職稱"],["spouse_name_snapshot","關係人姓名"],["notes","備註"],["created_at","填寫時間"]];const csv="\uFEFF"+[cols.map(c=>c[1]).join(","),...registrations.map(r=>cols.map(c=>{let v=r[c[0]];if(c[0]==="attending")v=v?"出席":"不出席";if(c[0]==="meal_required")v=v===true?"需要":v===false?"不需要":"";if(c[0]==="diet_type")v=v==="meat"?"葷食":v==="vegetarian"?"素食":"";return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(","))].join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="活動報名紀錄.csv";a.click();URL.revokeObjectURL(a.href);});
$("logout").addEventListener("click",async()=>{try{await db.auth.signOut();}catch(e){}["admin_access_token","admin_refresh_token","admin_email"].forEach(k=>localStorage.removeItem(k));location.href="https://tscgad917.github.io/login/";});
init();
})();
</script>
