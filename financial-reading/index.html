<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>財經知識選讀與分享｜淡水信用合作社</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#334136;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{background:#14532d;color:#fff;padding:20px 16px}header>div,main{max-width:960px;margin:auto}.brand{font-size:13px;opacity:.9}.brand-title{font-size:21px;font-weight:700}
main{padding:24px 16px 48px}.panel{background:#fff;border:1px solid #dfe7dc;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px #26332c0a}
h1{font-size:24px;color:#14532d;margin:0 0 8px}h2{font-size:19px;color:#245c39;margin:0 0 10px}.muted{color:#718071;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd7cb;border-radius:8px;font:inherit;margin:5px 0 12px;background:#fff}textarea{min-height:140px}
button{border:0;border-radius:8px;padding:11px 16px;background:#17613a;color:white;cursor:pointer;font:inherit;font-weight:600}button.secondary{background:#e6eee5;color:#355334}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.article{border:1px solid #dfe7dc;border-radius:12px;padding:16px;background:#fff}.article h3{margin:0 0 6px;color:#245c39;font-size:18px}.tag{display:inline-block;background:#edf5ef;color:#355334;border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 4px 8px 0}
.msg{padding:11px;border-radius:8px;background:#edf5ef;margin:10px 0;white-space:pre-wrap}.error{background:#fff0ef;color:#9f2e25}.hidden{display:none!important}
.viewer{width:100%;height:75vh;border:1px solid #dfe7dc;border-radius:8px;background:#f5f7f5}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.field label{display:block;font-weight:600;font-size:14px}.required{color:#a8322a}
@media(max-width:600px){main{padding:18px 12px}.panel{padding:16px}.viewer{height:65vh}}
</style></head><body>
<header><div><div class="brand">淡水信用合作社</div><div class="brand-title">財經知識選讀與分享</div></div></header>
<main>
<section id="identityPanel" class="panel">
<h1>開始閱讀</h1>
<p class="muted">本階段免帳號、免密碼。請選擇所屬營業單位並輸入姓名，即可閱讀文章及提交心得。請確認姓名填寫正確，以利總務課彙整參與情形。</p>
<div class="field"><label for="unit">所屬營業單位 <span class="required">*</span></label><select id="unit"><option value="">正在載入單位……</option></select></div>
<div class="field"><label for="name">姓名 <span class="required">*</span></label><input id="name" maxlength="80" autocomplete="name" placeholder="請輸入姓名"></div>
<button id="continueBtn">進入選讀文章</button><div id="identityMsg" class="msg hidden"></div>
</section>
<section id="appPanel" class="hidden">
<div class="panel topbar"><div><h1>本月財經知識選讀</h1><div class="muted" id="identitySummary"></div></div><button class="secondary" id="changeIdentity">更換姓名／單位</button></div>
<div id="monthlyContent"></div>
</section>
<section id="readerPanel" class="panel hidden">
<div class="topbar"><div><h2 id="readerTitle"></h2><div class="muted" id="readerMeta"></div></div><button class="secondary" id="closeReader">返回文章列表</button></div>
<iframe id="pdfViewer" class="viewer" title="文章 PDF 閱讀器"></iframe>
<div id="readMsg" class="msg hidden"></div><div style="margin-top:12px"><button id="markRead">標記已閱讀</button></div>
<div style="margin-top:22px;border-top:1px solid #e5ebe4;padding-top:18px"><h2>心得分享</h2><p class="muted">心得提交後，總務課可依單位及姓名彙整；相同文章、單位及姓名再次提交時，將更新原有心得。</p>
<textarea id="sharingContent" maxlength="10000" placeholder="分享這篇文章帶給你的觀點、啟發或工作上的連結……"></textarea><button id="saveSharing">提交／更新心得</button><div id="sharingMsg" class="msg hidden"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const URL="https://onebxqajsiqmhfcizaxl.supabase.co",KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
let identity=null,months=[],currentSelectionArticle=null,currentMonth=null;
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(id){$(id).classList.remove("hidden")}function hide(id){$(id).classList.add("hidden")}
function msg(id,t,error=false){$(id).textContent=t;$(id).classList.remove("hidden","error");if(error)$(id).classList.add("error");}
async function loadUnits(){
 const r=await db.rpc("fr_public_units");if(r.error)throw r.error;
 $("unit").innerHTML='<option value="">請選擇所屬營業單位</option>'+(r.data||[]).map(u=>'<option value="'+u.id+'">'+esc(u.code)+'｜'+esc(u.name)+'</option>').join("");
}
async function loadSelections(){
 $("monthlyContent").innerHTML='<div class="panel muted">正在載入選讀文章……</div>';
 const r=await db.from("fr_monthly_selections").select("id,month_start,title,description,reading_start_at,reading_end_at,fr_monthly_selection_articles(id,sort_order,reflection_required,fr_articles(id,title,author,publisher,issue_date,issue_date_precision,category,abstract,source_url,fr_article_files(id,storage_path,original_filename,is_current)))").eq("status","published").order("month_start",{ascending:false});
 if(r.error)throw r.error;
 months=(r.data||[]).filter(m=>m.fr_monthly_selection_articles?.length);
 $("monthlyContent").innerHTML=months.length?months.map(m=>'<section class="panel"><h2>'+esc(m.month_start)+'｜'+esc(m.title)+'</h2><p class="muted">'+esc(m.description||"")+'</p><div class="grid">'+m.fr_monthly_selection_articles.sort((a,b)=>a.sort_order-b.sort_order).map(x=>{const a=x.fr_articles||{};return '<article class="article"><h3>'+esc(a.title)+'</h3><div class="muted">'+esc(a.author||"")+'｜'+esc(a.publisher||"")+'</div><span class="tag">'+esc(a.category)+'</span><p>'+esc(a.abstract||"尚無文章簡介")+'</p><button data-open="'+x.id+'">閱讀文章</button></article>';}).join("")+'</div></section>').join(""):'<section class="panel">目前沒有開放中的選讀文章。</section>';
 $("monthlyContent").querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openArticle(b.dataset.open).catch(err=>alert("無法開啟文章："+err.message))));
}
async function openArticle(id){
 let item=null,month=null;for(const m of months){const found=(m.fr_monthly_selection_articles||[]).find(x=>x.id===id);if(found){item=found;month=m;break;}}
 if(!item||!item.fr_articles)throw new Error("找不到文章資料。");
 const a=item.fr_articles,file=(a.fr_article_files||[]).find(f=>f.is_current);if(!file)throw new Error("此文章目前沒有可閱讀的 PDF。");
 const signed=await db.storage.from("financial-reading-pdfs").createSignedUrl(file.storage_path,1800);if(signed.error)throw signed.error;
 currentSelectionArticle=item;currentMonth=month;
 $("readerTitle").textContent=a.title;$("readerMeta").textContent=(a.author||"")+"｜"+(a.publisher||"")+"｜刊登／出版："+(a.issue_date?(a.issue_date_precision==="month"?a.issue_date.slice(0,7):a.issue_date):"未提供")+"｜選讀月份："+month.month_start+"｜"+identity.unitName+"／"+identity.name;
 $("pdfViewer").src=signed.data.signedUrl+"#toolbar=1&navpanes=0";
 $("sharingContent").value="";
 $("sharingContent").value="";
 const read=await db.rpc("fr_public_submit_reading",{p_selection_article_id:item.id,p_unit_id:identity.unitId,p_submitter_name:identity.name,p_completed:false});if(read.error)throw read.error;
 hide("appPanel");show("readerPanel");$("readMsg").classList.add("hidden");$("sharingMsg").classList.add("hidden");
}
$("continueBtn").onclick=async()=>{
 const unitId=$("unit").value,name=$("name").value.trim();
 if(!unitId||!name){msg("identityMsg","請選擇所屬營業單位並輸入姓名。",true);return;}
 identity={unitId:Number(unitId),unitName:$("unit").selectedOptions[0].textContent,name};
 $("identitySummary").textContent=identity.unitName+"｜"+identity.name;
 try{await loadSelections();hide("identityPanel");show("appPanel");}catch(e){msg("identityMsg","載入文章失敗："+e.message,true);}
};
$("markRead").onclick=async()=>{
 if(!currentSelectionArticle)return;
 const r=await db.rpc("fr_public_submit_reading",{p_selection_article_id:currentSelectionArticle.id,p_unit_id:identity.unitId,p_submitter_name:identity.name,p_completed:true});
 if(r.error){msg("readMsg",r.error.message,true);return;}msg("readMsg","已記錄閱讀完成，謝謝你的參與。");
};
$("saveSharing").onclick=async()=>{
 if(!currentSelectionArticle)return;const content=$("sharingContent").value.trim();
 if(!content){msg("sharingMsg","請先輸入心得內容。",true);return;}
 const r=await db.rpc("fr_public_submit_sharing",{p_selection_article_id:currentSelectionArticle.id,p_unit_id:identity.unitId,p_submitter_name:identity.name,p_content:content});
 if(r.error){msg("sharingMsg","心得提交失敗："+r.error.message,true);return;}msg("sharingMsg","心得已成功提交，謝謝你的分享。");
};
$("closeReader").onclick=()=>{hide("readerPanel");show("appPanel");$("pdfViewer").src="about:blank";};
$("changeIdentity").onclick=()=>{hide("appPanel");hide("readerPanel");show("identityPanel");$("pdfViewer").src="about:blank";};
loadUnits().catch(e=>msg("identityMsg","無法載入單位清單："+e.message,true));
})();
</script></body></html>
