<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存盤點系統</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .item {
      margin-top: 18px;
    }

    .item-name {
      margin-bottom: 6px;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 12px;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>庫存盤點系統</h1>

    <label for="unit">盤點單位</label>
    <select id="unit">
  <option value="">請選擇單位</option>
  <option value="1">總務課</option>
  <option value="2">營業部</option>
  <option value="3">水碓分社</option>
  <option value="4">竹圍分社</option>
  <option value="5">英專分社</option>
  <option value="6">義山分社</option>
  <option value="7">三芝分社</option>
  <option value="8">八里分社</option>
  <option value="9">成州分社</option>
  <option value="10">五股分社</option>
  <option value="11">萬金分社</option>
  <option value="12">新莊分社</option>
  <option value="13">泰山分社</option>
  <option value="14">林口分社</option>
  <option value="15">板橋分社</option>
  <option value="16">蘆洲分社</option>
  <option value="17">三重分社</option>
</select>

    <label for="name">盤點人員</label>
    <input
      type="text"
      id="name"
      placeholder="請輸入姓名"
    >

    <div class="item">
      <div class="item-name">櫃員機色帶(長)</div>
      <input type="number" id="T" min="0" placeholder="請輸入數量">
    </div>

    <div class="item">
      <div class="item-name">報表機色帶(小)</div>
      <input type="number" id="R" min="0" placeholder="請輸入數量">
    </div>

    <div class="item">
      <div class="item-name">ATM色帶(長)</div>
      <input type="number" id="AP" min="0" placeholder="請輸入數量">
    </div>

    <div class="item">
      <div class="item-name">ATM色帶(小)</div>
      <input type="number" id="AR" min="0" placeholder="請輸入數量">
    </div>

    <div class="item">
      <div class="item-name">ATM紙捲(餘額證明)</div>
      <input type="number" id="AB" min="0" placeholder="請輸入數量">
    </div>

    <div class="item">
      <div class="item-name">ATM紙捲(敘時)</div>
      <input type="number" id="AN" min="0" placeholder="請輸入數量">
    </div>

    <button type="button" onclick="submitForm()">
      送出盤點資料
    </button>

    <div class="note">
      ※ 請確認盤點單位、盤點人員及各項庫存數量均填寫正確後再送出。
    </div>

  </div>

  <script>
    function submitForm() {
      alert("目前為畫面測試，尚未連接資料庫。");
    }
  </script>

</body>
</html>
