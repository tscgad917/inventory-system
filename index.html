  <style>
    body {

    <div id="status" class="status">
      正在確認本次盤點期間……
    </div>

    <div id="formArea">

      <label for="unit">盤點單位</label>
      <select id="unit">
        <option value="">請選擇單位</option>

        <option value="9">成州分社</option>
        <option value="10">五股分社</option>
        <option value="11">萬金分社</option>
        <option value="12">新莊分社</option>
        <option value="13">泰山分社</option>
        <option value="14">林口分社</option>
        <option value="15">板橋分社</option>
        <option value="16">蘆洲分社</option>

      </select>

      <label for="name">盤點人員</label>
      <input
        type="text"
        id="name"
        placeholder="請輸入姓名"
      >

      <div class="item">
        <div class="item-name">櫃員機色帶(長)</div>
        <input type="number" id="T" min="0" placeholder="請輸入數量">

      <div class="item">

        <input type="number" id="AP" min="0" placeholder="請輸入數量">
      </div>

      <div class="item">
        <div class="item-name">ATM色帶(小)</div>
        <input type="number" id="AR" min="0" placeholder="請輸入數量">
      </div>

      <div class="item">
        <div class="item-name">ATM紙捲(餘額證明)</div>
        <input type="number" id="AB" min="0" placeholder="請輸入數量">
      </div>

      <div class="item">
        <div class="item-name">ATM紙捲(敘時)</div>
        <input type="number" id="AN" min="0" placeholder="請輸入數量">
      </div>

      <button
        type="button"
        id="submitButton"
        onclick="submitForm()"
        disabled

      </button>

        ※ 請確認盤點單位、盤點人員及各項庫存數量均填寫正確後再送出。

    </div>

  </div>

<script>

  const SUPABASE_URL =
    "https://onebxqajsiqmhfcizaxl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";

  let currentPeriod = null;


  // ============================================================
  // 取得今天日期
  // ============================================================

  function getToday() {

    const today = new Date();

    return (
      today.getFullYear() +
      "-" +
      String(today.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(today.getDate()).padStart(2, "0")
    );
  }


  // ============================================================
  // 檢查今天是否為開放盤點日
  // ============================================================

  async function checkInventoryPeriod() {

    const status =
      document.getElementById("status");

    const formArea =
      document.getElementById("formArea");

    const submitButton =
      document.getElementById("submitButton");

    const today = getToday();


    try {

      const url =
        SUPABASE_URL +
        "/rest/v1/inventory_periods" +
        "?select=period_month,count_date,is_open" +
        "&count_date=eq." +
        today +
        "&apikey=" +
        encodeURIComponent(SUPABASE_KEY);


      const controller =
        new AbortController();


      const timeout =
        setTimeout(function () {

          controller.abort();

        }, 10000);


      const response =
        await fetch(url, {

          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY
          },

          signal: controller.signal

        });


      clearTimeout(timeout);


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "inventory_periods API error:",
          errorText
        );

        status.className =
          "status closed";

        status.textContent =
          "盤點期間資料讀取失敗，請通知總務課處理。";

        formArea.classList.add(
          "disabled"
        );

        submitButton.disabled = true;

        return;
      }


      const periods =
        await response.json();


      console.log(
        "inventory_periods:",
        periods
      );


      // 今天沒有設定為盤點日

      if (periods.length === 0) {

        status.className =
          "status closed";

        status.textContent =
          "目前非盤點期間，暫不開放盤點。";

        formArea.classList.add(
          "disabled"
        );

        submitButton.disabled = true;

        return;
      }


      const period =
        periods[0];


      // 今天是盤點日，但尚未開放

      if (!period.is_open) {

        status.className =
          "status closed";

        status.textContent =
          "本日為盤點日，但目前尚未開放盤點。";

        formArea.classList.add(
          "disabled"
        );

        submitButton.disabled = true;

        return;
      }


      // 今天是開放盤點日

      currentPeriod =
        period;


      status.className =
        "status open";

      status.textContent =
        "本日為盤點日，現在可以填寫及送出盤點資料。";


      formArea.classList.remove(
        "disabled"
      );

      submitButton.disabled =
        false;

    }


    catch (error) {

      console.error(
        "checkInventoryPeriod error:",
        error
      );


      status.className =
        "status closed";


      if (error.name === "AbortError") {

        status.textContent =
          "盤點期間資料讀取逾時，請通知總務課處理。";

      } else {

        status.textContent =
          "系統連線失敗，請稍後再試。";
      }


      formArea.classList.add(
        "disabled"
      );

      submitButton.disabled =
        true;
    }

  }


  // ============================================================
  // 送出盤點資料
  // ============================================================

  async function submitForm() {


    // 再次確認盤點期間

    if (
      !currentPeriod ||
      !currentPeriod.is_open
    ) {

      alert(
        "目前非開放盤點期間，無法送出資料。"
      );

      return;
    }


    const unitId =
      document.getElementById("unit").value;

    const name =
      document.getElementById("name").value.trim();


    if (!unitId) {

      alert(
        "請選擇盤點單位"
      );

      return;
    }


    if (!name) {

      alert(
        "請輸入盤點人員姓名"
      );

      return;
    }


    const itemIds =
      [1, 2, 3, 4, 5, 6];


    const itemCodes =
      ["T", "R", "AP", "AR", "AB", "AN"];


    const quantities = [];


    for (
      let i = 0;
      i < itemIds.length;
      i++
    ) {

      const value =
        document.getElementById(
          itemCodes[i]
        ).value;


      if (value === "") {

        alert(
          "請填寫全部 6 項庫存數量"
        );

        return;
      }


      if (Number(value) < 0) {

        alert(
          "庫存數量不可小於 0"
        );

        return;
      }


      quantities.push(
        Number(value)
      );
    }


    // 使用資料庫設定的正式盤點日期

    const countDate =
      currentPeriod.count_date;


    const data =
      itemIds.map(
        function (itemId, index) {

          return {
            count_date: countDate,
            unit_id: Number(unitId),
            item_id: itemId,
            quantity: quantities[index],
            submitted_by: name
          };

        }
      );


    const submitButton =
      document.getElementById(
        "submitButton"
      );


    submitButton.disabled =
      true;

    submitButton.textContent =
      "送出中……";


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/monthly_counts",
          {

            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(data)

          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          errorText
        );


        if (
          response.status === 409
        ) {

          alert(
            "此單位本次盤點資料已經送出，請勿重複提交。"
          );

        } else {

          alert(
            "送出失敗，請通知總務課處理。"
          );
        }


        submitButton.disabled =
          false;

        submitButton.textContent =
          "送出盤點資料";

        return;
      }


      alert(
        "盤點資料已成功送出！"
      );


      // 清空表單

      document.getElementById(
        "unit"
      ).value = "";

      document.getElementById(
        "name"
      ).value = "";


      for (
        const code of itemCodes
      ) {

        document.getElementById(
          code
        ).value = "";

      }


      submitButton.disabled =
        false;

      submitButton.textContent =
        "送出盤點資料";

    }


    catch (error) {

      console.error(
        error
      );


      alert(
        "系統連線失敗，請稍後再試。"
      );


      submitButton.disabled =
        false;

      submitButton.textContent =
        "送出盤點資料";
    }

  }


  // ============================================================
  // 開啟頁面時檢查盤點期間
  // ============================================================

  checkInventoryPeriod();

</script>

</body>
</html>
