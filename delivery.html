<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>耗材配送登錄</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .fixed-unit {
      padding: 10px;
      background: #f1f1f1;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #333;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .back {
      background: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>耗材配送登錄</h1>

    <label>配送單位</label>
    <div class="fixed-unit">
      總務課
    </div>

    <label for="date">配送日期</label>
    <input type="date" id="date">

    <label for="unit">領用單位</label>
    <select id="unit">
      <option value="">請選擇單位</option>
      <option value="2">營業部</option>
      <option value="3">水碓分社</option>
      <option value="4">竹圍分社</option>
      <option value="5">英專分社</option>
      <option value="6">義山分社</option>
      <option value="7">三芝分社</option>
      <option value="8">八里分社</option>
      <option value="9">成州分社</option>
      <option value="10">五股分社</option>
      <option value="11">萬金分社</option>
      <option value="12">新莊分社</option>
      <option value="13">泰山分社</option>
      <option value="14">林口分社</option>
      <option value="15">板橋分社</option>
      <option value="16">蘆洲分社</option>
      <option value="17">三重分社</option>
    </select>

    <label for="item">耗材項目</label>
    <select id="item">
      <option value="">請選擇耗材</option>
      <option value="1">櫃員機色帶(長)</option>
      <option value="2">報表機色帶(小)</option>
      <option value="3">ATM色帶(長)</option>
      <option value="4">ATM色帶(小)</option>
      <option value="5">ATM紙捲(餘額證明)</option>
      <option value="6">ATM紙捲(敘時)</option>
    </select>

    <label for="quantity">配送數量</label>
    <input
      type="number"
      id="quantity"
      min="1"
      placeholder="請輸入配送數量"
    >

    <button type="button" onclick="submitDelivery()">
      送出配送資料
    </button>

    <button
      type="button"
      class="back"
      onclick="location.href='admin-home.html'"
    >
      返回後台
    </button>

  </div>

  <script>
    const SUPABASE_URL = "https://onebxqajsiqmhfcizaxl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";

    // 預設今天
    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];

    async function submitDelivery() {

      const date = document.getElementById("date").value;
      const unitId = document.getElementById("unit").value;
      const itemId = document.getElementById("item").value;
      const quantity = document.getElementById("quantity").value;

      if (!date) {
        alert("請選擇配送日期");
        return;
      }

      if (!unitId) {
        alert("請選擇領用單位");
        return;
      }

      if (!itemId) {
        alert("請選擇耗材項目");
        return;
      }

      if (!quantity || Number(quantity) <= 0) {
        alert("請輸入正確的配送數量");
        return;
      }

      const data = {
        delivery_date: date,
        from_unit_id: 1,
        to_unit_id: Number(unitId),
        item_id: Number(itemId),
        quantity: Number(quantity)
      };

      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/deliveries",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },
            body: JSON.stringify(data)
          }
        );

        if (!response.ok) {
          const errorText = await response.text();
          console.error(errorText);
          alert("配送資料送出失敗。");
          return;
        }

        alert("配送資料已成功登錄！");

        document.getElementById("unit").value = "";
        document.getElementById("item").value = "";
        document.getElementById("quantity").value = "";

      } catch (error) {

        console.error(error);
        alert("系統連線失敗，請稍後再試。");

      }
    }
  </script>

</body>
</html>
