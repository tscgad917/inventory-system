  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f6f3;
      color: #26332c;
    }

    .page-header {
      background: #14532d;
      color: white;
      padding: 22px 24px;
      box-shadow: 0 2px 8px rgba(20, 83, 45, 0.12);
    }

    .header-inner {
      max-width: 920px;

    }

    .system-name {
      font-size: 14px;
      letter-spacing: 0.08em;
      opacity: 0.88;
      margin-bottom: 5px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .container {
      max-width: 760px;
      margin: 42px auto 60px;
      padding: 0 24px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #174c2d;
    }

    .subtitle {
      margin: 0;
      color: #66736b;
      font-size: 15px;
      line-height: 1.7;
    }

    .menu-card {
      display: block;
      position: relative;
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 14px;
      color: #26332c;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(31, 55, 40, 0.05);
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      border-color: #a9c5b1;
      box-shadow: 0 5px 14px rgba(31, 55, 40, 0.09);
    }

    .menu-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-number {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #e8f1eb;
      color: #17613a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
    }

    .menu-text {
      flex: 1;
      min-width: 0;
    }

    .menu-title {
      font-size: 17px;
      font-weight: 600;
      color: #23432f;
      margin-bottom: 3px;
    }

    .menu-description {
      font-size: 13px;
      color: #7a857e;
      line-height: 1.5;
    }

    .menu-arrow {
      color: #659276;
      font-size: 22px;
      line-height: 1;
      margin-left: 8px;
    }

    .logout-area {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #dce5df;
    }

    .logout {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #cbd4ce;
      border-radius: 9px;
      background: #ffffff;
      color: #66706a;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .logout:hover {
      background: #f7f8f7;
      border-color: #b8c3bb;
      color: #414a44;
    }

    @media (max-width: 600px) {

      .page-header {
        padding: 18px 20px;
      }

      .header-title {
        font-size: 20px;
      }

      .container {
        margin-top: 30px;
        padding: 0 16px;
      }

      .intro h1 {
        font-size: 23px;
      }

      .menu-card {
        padding: 17px 18px;
      }

      .menu-title {
        font-size: 16px;
      }

      .menu-description {
        font-size: 12px;
      }
    }

</head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
// 導覽限制：首次進入需由統一管理中心點選；同一分頁重新整理可繼續使用。
// 這是前端導覽限制，不取代 Supabase 的身分驗證與 RLS 權限。
const nav=performance.getEntriesByType("navigation")[0];
const isReload=nav&&nav.type==="reload";
const ticket=sessionStorage.getItem("inventoryAdminEntryTicket")==="from-center";
const fromCenter=ticket;
sessionStorage.removeItem("inventoryAdminEntryTicket");
if(!fromCenter&&!(isReload&&sessionStorage.getItem("inventoryAdminTabAuthorized")==="yes")){
  document.body.innerHTML='<main style="max-width:680px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;line-height:1.8;color:#26332c"><h2>請由統一管理中心進入</h2><p>為避免直接開啟後台連結，請先返回統一管理中心，再點選「庫存盤點管理」。</p><a href="admin-center.html">返回統一管理中心</a></main>';
}else{
  sessionStorage.setItem("inventoryAdminTabAuthorized","yes");
}
if(!fromCenter&&!(isReload&&sessionStorage.getItem("inventoryAdminTabAuthorized")==="yes")) return;
const SUPABASE_URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const SUPABASE_KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const adminDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function checkAdminSession(){
  const {data,error}=await adminDb.auth.getSession();
  if(error||!data.session){
    window.location.replace("admin.html");
    return;
  }
  const user=await adminDb.auth.getUser();
  if(user.error||(user.data.user.email||"").toLowerCase()!=="tscgad917@gmail.com"){
    window.location.replace("admin.html");
  }
}
checkAdminSession();

async function logout(){
  try{await adminDb.auth.signOut();}catch(e){console.error("登出失敗",e);}
  ["admin_access_token","admin_refresh_token","admin_email"].forEach(k=>localStorage.removeItem(k));
  window.location.replace("admin.html");
}
})();
</script>
