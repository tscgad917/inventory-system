<!DOCTYPE html>

<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>庫存盤點系統｜總務課管理後台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f6f3;
      color: #26332c;
    }

    .page-header {
      background: #14532d;
      color: white;
      padding: 22px 24px;
      box-shadow: 0 2px 8px rgba(20, 83, 45, 0.12);
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
    }

    .system-name {
      font-size: 14px;
      letter-spacing: 0.08em;
      opacity: 0.88;
      margin-bottom: 5px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .container {
      max-width: 760px;
      margin: 42px auto 60px;
      padding: 0 24px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
      color: #174c2d;
    }

    .subtitle {
      margin: 0;
      color: #66736b;
      font-size: 15px;
      line-height: 1.7;
    }

    .menu-card {
      display: block;
      position: relative;
      background: #ffffff;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 14px;
      color: #26332c;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(31, 55, 40, 0.05);
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      border-color: #a9c5b1;
      box-shadow: 0 5px 14px rgba(31, 55, 40, 0.09);
    }

    .menu-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-number {
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #e8f1eb;
      color: #17613a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
    }

    .menu-text {
      flex: 1;
      min-width: 0;
    }

    .menu-title {
      font-size: 17px;
      font-weight: 600;
      color: #23432f;
      margin-bottom: 3px;
    }

    .menu-description {
      font-size: 13px;
      color: #7a857e;
      line-height: 1.5;
    }

    .menu-arrow {
      color: #659276;
      font-size: 22px;
      line-height: 1;
      margin-left: 8px;
    }

    .logout-area {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid #dce5df;
    }

    .logout {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #cbd4ce;
      border-radius: 9px;
      background: #ffffff;
      color: #66706a;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .logout:hover {
      background: #f7f8f7;
      border-color: #b8c3bb;
      color: #414a44;
    }

    @media (max-width: 600px) {

      .page-header {
        padding: 18px 20px;
      }

      .header-title {
        font-size: 20px;
      }

      .container {
        margin-top: 30px;
        padding: 0 16px;
      }

      .intro h1 {
        font-size: 23px;
      }

      .menu-card {
        padding: 17px 18px;
      }

      .menu-title {
        font-size: 16px;
      }

      .menu-description {
        font-size: 12px;
      }
    }
  </style>

</head>

<body>

  <header class="page-header">
    <div class="header-inner">
      <div class="system-name">
        淡水信用合作社
      </div>

      <div class="header-title">
        庫存盤點系統
      </div>
    </div>
  </header>


  <main class="container">

    <div class="intro">
      <h1>總務課管理後台</h1>

      <p class="subtitle">
        請選擇欲執行的管理作業
      </p>
    </div>


    <a href="period.html" class="menu-card">
      <div class="menu-content">

        <div class="menu-number">
          01
        </div>

        <div class="menu-text">
          <div class="menu-title">
            盤點期間設定
          </div>

          <div class="menu-description">
            設定盤點日期及開放期間
          </div>
        </div>

        <div class="menu-arrow">
          ›
        </div>

      </div>
    </a>


    <a href="delivery.html" class="menu-card">
      <div class="menu-content">

        <div class="menu-number">
          02
        </div>

        <div class="menu-text">
          <div class="menu-title">
            耗材配送登錄
          </div>

          <div class="menu-description">
            登錄各單位耗材配送資料
          </div>
        </div>

        <div class="menu-arrow">
          ›
        </div>

      </div>
    </a>


    <a href="purchase.html" class="menu-card">
      <div class="menu-content">

        <div class="menu-number">
          03
        </div>

        <div class="menu-text">
          <div class="menu-title">
            廠商進貨登錄
          </div>

          <div class="menu-description">
            登錄廠商進貨及採購資料
          </div>
        </div>

        <div class="menu-arrow">
          ›
        </div>

      </div>
    </a>


    <a href="count-management.html" class="menu-card">
      <div class="menu-content">

        <div class="menu-number">
          04
        </div>

        <div class="menu-text">
          <div class="menu-title">
            盤點資料管理
          </div>

          <div class="menu-description">
            查詢及管理各單位盤點資料
          </div>
        </div>

        <div class="menu-arrow">
          ›
        </div>

      </div>
    </a>


    <a href="inventory.html" class="menu-card">
      <div class="menu-content">

        <div class="menu-number">
          05
        </div>

        <div class="menu-text">
          <div class="menu-title">
            庫存統計
          </div>

          <div class="menu-description">
            查看各月份耗材庫存統計結果
          </div>
        </div>

        <div class="menu-arrow">
          ›
        </div>

      </div>
    </a>


    <div class="logout-area">

      <button
        type="button"
        class="logout"
        onclick="logout()"
      >
        登出管理後台
      </button>

    </div>

  </main>


  <script>

    // 檢查是否已登入
    const accessToken =
      localStorage.getItem(
        "admin_access_token"
      );

    if (!accessToken) {
      window.location.href =
        "admin.html";
    }


    function logout() {

      localStorage.removeItem(
        "admin_access_token"
      );

      localStorage.removeItem(
        "admin_refresh_token"
      );

      localStorage.removeItem(
        "admin_email"
      );

      window.location.href =
        "admin.html";
    }

  </script>

</body>
</html>
