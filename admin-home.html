<head>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .menu-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 17px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .menu-button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>總務課管理後台</h1>

    <div class="subtitle">
      庫存盤點系統
    </div>

   <a href="delivery.html" class="menu-button">耗材配送登錄</a>
<a href="purchase.html" class="menu-button">廠商進貨登錄</a>
<a href="inventory.html" class="menu-button">庫存統計</a>

    <button
      type="button"
      class="menu-button logout"
      onclick="logout()"
    >
      登出
    </button>

  </div>

 <script>
  // 檢查是否已登入
  const accessToken = localStorage.getItem("admin_access_token");

  if (!accessToken) {
    window.location.href = "admin.html";
  }

  function logout() {

    localStorage.removeItem("admin_access_token");
    localStorage.removeItem("admin_email");

    window.location.href = "admin.html";
  }
</script>

</body>
